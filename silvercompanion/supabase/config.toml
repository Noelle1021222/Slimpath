# Supabase CLI configuration for local development (`supabase start`).
project_id = "silvercompanion"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5174"
additional_redirect_urls = ["http://127.0.0.1:5174/auth/callback", "http://localhost:5174/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = true
enable_confirmations = true
template = "【銀髮伴】您的驗證碼是 {{ .Code }}，10 分鐘內有效。"

[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false

[functions.linepay-request]
verify_jwt = true

[functions.linepay-confirm]
verify_jwt = true

[functions.linepay-refund]
verify_jwt = true

[functions.sos-notify]
verify_jwt = true

# Called before the user has a Supabase session.
[functions.line-login]
verify_jwt = false
