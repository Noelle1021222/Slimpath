// tiny SVG chart helper. cfg: {w,h,x:[a,b],y:[a,b],xt,yt,xl,yl,series:[{pts,color,dash,marker}]}
function chart(cfg) {
  const W = cfg.w || 560, H = cfg.h || 290, m = { l: 54, r: 16, t: 14, b: 46 };
  const sx = (x) => m.l + ((x - cfg.x[0]) / (cfg.x[1] - cfg.x[0])) * (W - m.l - m.r);
  const sy = (y) => H - m.b - ((y - cfg.y[0]) / (cfg.y[1] - cfg.y[0])) * (H - m.t - m.b);
  const s = sv('svg', { viewBox: '0 0 ' + W + ' ' + H, width: W, role: 'img', 'aria-label': cfg.label || '圖表' });
  s.append(sv('rect', { x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b, fill: '#ffffff', 'fill-opacity': 0.75 }));
  const mono = 'JetBrains Mono, monospace';
  cfg.yt.forEach((v) => {
    s.append(sv('line', { x1: m.l, x2: W - m.r, y1: sy(v), y2: sy(v), stroke: '#d3dcf0', 'stroke-width': 1 }));
    s.append(sv('text', { x: m.l - 8, y: sy(v) + 4, 'text-anchor': 'end', 'font-size': 12, fill: '#55608a', 'font-family': mono, text: cfg.yf ? cfg.yf(v) : String(v) }));
  });
  cfg.xt.forEach((v) => {
    s.append(sv('line', { x1: sx(v), x2: sx(v), y1: H - m.b, y2: H - m.b + 5, stroke: '#1b2340', 'stroke-width': 1.5 }));
    s.append(sv('text', { x: sx(v), y: H - m.b + 19, 'text-anchor': 'middle', 'font-size': 12, fill: '#55608a', 'font-family': mono, text: cfg.xf ? cfg.xf(v) : String(v) }));
  });
  s.append(sv('path', { d: 'M' + m.l + ' ' + m.t + ' V' + (H - m.b) + ' H' + (W - m.r), fill: 'none', stroke: '#1b2340', 'stroke-width': 2 }));
  if (cfg.xl) s.append(sv('text', { x: (m.l + W - m.r) / 2, y: H - 6, 'text-anchor': 'middle', 'font-size': 13, fill: '#1b2340', 'font-weight': 700, text: cfg.xl }));
  if (cfg.yl) s.append(sv('text', { x: 14, y: (m.t + H - m.b) / 2, 'text-anchor': 'middle', 'font-size': 13, fill: '#1b2340', 'font-weight': 700, transform: 'rotate(-90 14 ' + (m.t + H - m.b) / 2 + ')', text: cfg.yl }));
  const under = sv('g'); s.append(under);
  (cfg.series || []).forEach((se) => {
    const d = se.pts.map((p, i) => (i ? 'L' : 'M') + sx(p[0]).toFixed(1) + ' ' + sy(p[1]).toFixed(1)).join(' ');
    s.append(sv('path', { d, fill: 'none', stroke: se.color, 'stroke-width': se.width || 3, 'stroke-dasharray': se.dash || null, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
    if (se.marker) se.pts.forEach((p) => {
      const x = sx(p[0]), y = sy(p[1]);
      if (se.marker === 'tri') s.append(sv('path', { d: 'M' + x + ' ' + (y - 6) + ' L' + (x + 5.5) + ' ' + (y + 4.5) + ' L' + (x - 5.5) + ' ' + (y + 4.5) + ' Z', fill: se.color, stroke: '#1b2340', 'stroke-width': 1 }));
      else if (se.marker === 'x') s.append(sv('path', { d: 'M' + (x - 4.5) + ' ' + (y - 4.5) + ' L' + (x + 4.5) + ' ' + (y + 4.5) + ' M' + (x + 4.5) + ' ' + (y - 4.5) + ' L' + (x - 4.5) + ' ' + (y + 4.5), fill: 'none', stroke: se.color, 'stroke-width': 3 }));
      else if (se.marker === 'sq') s.append(sv('rect', { x: x - 5, y: y - 5, width: 10, height: 10, fill: se.color, stroke: '#1b2340', 'stroke-width': 1 }));
      else s.append(sv('circle', { cx: x, cy: y, r: 4.5, fill: se.color, stroke: '#1b2340', 'stroke-width': 1 }));
    });
  });
  const over = sv('g'); s.append(over);
  return { el: s, sx, sy, over, under, W, H, m };
}
const interp = (pts, x) => {
  if (x <= pts[0][0]) return pts[0][1];
  for (let i = 1; i < pts.length; i++) if (x <= pts[i][0]) { const a = pts[i - 1], b = pts[i]; return a[1] + ((b[1] - a[1]) * (x - a[0])) / (b[0] - a[0]); }
  return pts[pts.length - 1][1];
};

    g.append(sv('text', { x: cx + Math.cos(a) * (R + 14), y: cy - Math.sin(a) * (R + 14) + 5, 'text-anchor': 'middle', 'font-size': 15, 'font-weight': 700, fill: color, text: label }));
  };
  return { el: s, clear() { g.innerHTML = ''; }, arrow, dot() { g.append(sv('circle', { cx, cy, r: 4, fill: '#1b2340' })); } };

// schedule of per-layer loading and recompute. over[i] = load layer i+2 while recomputing layer i+1
function pipeSchedule(Ld, C, over) {
  const N = over.length + 1, Ls = [], Le = [], Cs = [], Ce = [];
  for (let i = 0; i < N; i++) {
    Ls[i] = i === 0 ? 0 : Math.max(over[i - 1] ? Cs[i - 1] : Ce[i - 1], Le[i - 1]);
    Le[i] = Ls[i] + Ld;
    Cs[i] = Math.max(Le[i], i ? Ce[i - 1] : 0);
    Ce[i] = Cs[i] + C;
  }
  return { Ls, Le, Cs, Ce, total: Ce[N - 1] };
}

  c.under.append(sv('text', { x: c.sx(1.5), y: c.sy(0.1), 'font-size': 13, fill: '#55608a', 'font-weight': 700, text: '往左上角越好' }));

      const g = sv('g', { style: 'cursor:pointer' });
      g.append(sv('circle', { cx: c.sx(p.x), cy: c.sy(p.y), r: i === cur && !locked ? 17 : 14, fill: m ? m.color : '#ffffff', stroke: '#1b2340', 'stroke-width': i === cur && !locked ? 4 : 2.5 }));

    });

    chips.innerHTML = '';

      chips.append(h('button.tok' + (assign[p.id] === m.key ? '.sel' : ''), { onclick: () => {
        if (locked) return;

    });
  };

  };

// ===== 3D engine: renderer, player, camera, input, collisions =====
const PH = { speed: 6.4, accel: 13, g: 30, jump: 10.6, r: 0.42, height: 1.5, step: 0.58, guard: 0.8 };
const E = {
  ok: false, running: false, mode: 'idle', t: 0, quality: 'high',
  level: null, tweens: [], auto: null, focusT: 0, focusPos: null, lockInput: false,
  keys: {}, stick: { x: 0, y: 0, on: false }, jumpQ: false,
  camYaw: 0, camPitch: 0.74, camDist: 13.5, yawOff: 0, pitchOff: 0,
  p: null,

  init(canvas) {
    if (!window.THREE) return false;
    try {
      this.canvas = canvas;
      const r = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
      this.renderer = r;
      r.shadowMap.type = THREE.PCFSoftShadowMap;
      this.scene = new THREE.Scene();
      this.cam = new THREE.PerspectiveCamera(48, 1, 0.3, 400);
      this.camTarget = new THREE.Vector3();
      this.hemi = new THREE.HemisphereLight(0xffffff, 0x445577, 0.85);
      this.sun = new THREE.DirectionalLight(0xffffff, 0.75);
      this.sun.castShadow = true;
      this.sun.shadow.mapSize.set(1024, 1024);
      const sc = this.sun.shadow.camera;
      sc.left = -24; sc.right = 24; sc.top = 24; sc.bottom = -24; sc.near = 1; sc.far = 90;
      this.sun.shadow.bias = -0.0012;
      this.scene.add(this.hemi, this.sun, this.sun.target);
      this.ray = new THREE.Raycaster();
      this.p = { pos: new THREE.Vector3(), vel: new THREE.Vector3(), yaw: 0, grounded: true, groundCol: null, air: 0, coy: 0, safe: new THREE.Vector3(), safeT: 0, moveAmt: 0, squash: 0, model: null, carry: null };
      this.fxInit();
      this.bindInput();
      this.setQuality(SV.d.opt.q || 'auto');
      this.resize();
      window.addEventListener('resize', () => this.resize());
      if (window.ResizeObserver) new ResizeObserver(() => this.resize()).observe(canvas.parentElement);
      this.ok = true;
      return true;
    } catch (e) {
      console.warn('WebGL init failed', e);
      this.ok = false;
      return false;
    }
  },

  setQuality(q) {
    if (!this.renderer) return;
    this.qPref = q;
    const coarse = isCoarse();
    const eff = q === 'auto' ? (coarse ? 'mid' : 'high') : q;
    this.quality = eff;
    const dpr = window.devicePixelRatio || 1;
    this.renderer.setPixelRatio(eff === 'low' ? 1 : Math.min(dpr, eff === 'mid' ? 1.5 : 2));
    this.renderer.shadowMap.enabled = eff !== 'low';
    this.sun.castShadow = eff !== 'low';
    this.scene.traverse((o) => { if (o.material) { (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => { m.needsUpdate = true; }); } });
    this.resize();
  },

  resize() {
    if (!this.renderer) return;
    const w = Math.max(1, this.canvas.parentElement.clientWidth), hgt = Math.max(1, this.canvas.parentElement.clientHeight);
    this.renderer.setSize(w, hgt, false);
    this.cam.aspect = w / hgt;
    this.portrait = w < hgt;
    this.cam.fov = this.portrait ? 58 : 48;
    this.cam.updateProjectionMatrix();
  },

  // ---------- input ----------
  bindInput() {
    const c = this.canvas;
    window.addEventListener('keydown', (e) => {
      if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
      const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].indexOf(k) >= 0) e.preventDefault();
      if (!this.keys[k]) bus.emit('key', k, e);
      this.keys[k] = true;
      if (k === ' ' && !UI.blocking()) this.jumpQ = true;
    });
    window.addEventListener('keyup', (e) => { const k = e.key.length === 1 ? e.key.toLowerCase() : e.key; this.keys[k] = false; });
    window.addEventListener('blur', () => { this.keys = {}; this.stick.on = false; this.stick.x = this.stick.y = 0; });

    // virtual stick
    const st = $('#stick'), knob = $('#stick-knob');
    let sid = null;
    const setStick = (e) => {
      const r = st.getBoundingClientRect();
      let dx = (e.clientX - (r.left + r.width / 2)) / (r.width / 2), dy = (e.clientY - (r.top + r.height / 2)) / (r.height / 2);
      const len = Math.hypot(dx, dy);
      if (len > 1) { dx /= len; dy /= len; }
      this.stick.x = dx; this.stick.y = dy; this.stick.on = true;
      knob.style.transform = 'translate(' + dx * r.width * 0.3 + 'px,' + dy * r.height * 0.3 + 'px)';
    };
    const endStick = () => { sid = null; this.stick.on = false; this.stick.x = this.stick.y = 0; knob.style.transform = ''; };
    st.addEventListener('pointerdown', (e) => { e.preventDefault(); AU.init(); sid = e.pointerId; try { st.setPointerCapture(sid); } catch (er) { /* no capture */ } setStick(e); });
    st.addEventListener('pointermove', (e) => { if (e.pointerId === sid) setStick(e); });
    st.addEventListener('pointerup', (e) => { if (e.pointerId === sid) endStick(); });
    st.addEventListener('pointercancel', endStick);
    $('#btn-jump').addEventListener('pointerdown', (e) => { e.preventDefault(); AU.init(); if (!UI.blocking()) this.jumpQ = true; });

    // canvas: tap to walk, drag to look around, wheel to zoom
    let drag = null;
    c.addEventListener('pointerdown', (e) => {
      AU.init();
      drag = { id: e.pointerId, x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, t: performance.now(), moved: false };
      try { c.setPointerCapture(e.pointerId); } catch (er) { /* no capture */ }
    });
    c.addEventListener('pointermove', (e) => {
      if (!drag || drag.id !== e.pointerId) return;
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 9) drag.moved = true;
      if (drag.moved && this.mode === 'play') {
        this.yawOff = clamp(this.yawOff - dx * 0.006, -1.5, 1.5);
        this.pitchOff = clamp(this.pitchOff + dy * 0.004, -0.4, 0.4);
        this.lookT = this.t;
      }
      drag.x = e.clientX; drag.y = e.clientY;
    });
    const up = (e) => {
      if (!drag || drag.id !== e.pointerId) return;
      const d = drag; drag = null;
      if (!d.moved && performance.now() - d.t < 400) this.tap(e.clientX, e.clientY);
    };
    c.addEventListener('pointerup', up);
    c.addEventListener('pointercancel', () => { drag = null; });
    c.addEventListener('wheel', (e) => { e.preventDefault(); this.camDist = clamp(this.camDist + e.deltaY * 0.01, 8, 22); }, { passive: false });
    c.addEventListener('contextmenu', (e) => e.preventDefault());
  },

  tap(cx, cy) {
    if (this.mode !== 'play' || UI.blocking() || this.lockInput || !this.level) return;
    const r = this.canvas.getBoundingClientRect();
    const v = new THREE.Vector2(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
    this.ray.setFromCamera(v, this.cam);
    const hits = this.ray.intersectObjects(this.level.pick, false);
    if (!hits.length) return;
    const pt = hits[0].point;
    let near = null, nd = 2.2;
    this.level.inter.forEach((it) => { if (it.enabled === false) return; const d = Math.hypot(it.x - pt.x, it.z - pt.z); if (d < nd) { nd = d; near = it; } });
    this.auto = { x: near ? near.x : pt.x, z: near ? near.z : pt.z, inter: near, stuck: 0, last: this.p.pos.clone() };
    if (this.level.tapRing) { this.level.tapRing.position.set(this.auto.x, pt.y + 0.06, this.auto.z); this.level.tapRing.visible = true; this.level.tapRing.userData.t = 0; }
  },

  // ---------- level plumbing ----------
  setLevel(lv) {
    this.clearLevel();
    this.level = lv;
    this.scene.add(lv.group);
    const th = lv.theme;
    this.scene.background = lv.skyTex;
    this.scene.fog = new THREE.Fog(th.fog, th.fogNear || 34, th.fogFar || 95);
    this.hemi.color.setHex(th.hemiSky); this.hemi.groundColor.setHex(th.hemiGround); this.hemi.intensity = th.hemiI == null ? 0.62 : th.hemiI;
    this.sun.color.setHex(th.sun); this.sun.intensity = th.sunI == null ? 0.5 : th.sunI;
    this.sunDir = new THREE.Vector3(th.sunDir[0], th.sunDir[1], th.sunDir[2]).normalize();
    this.camYaw = lv.cam.yaw || 0; this.camPitch = lv.cam.pitch || 0.74; this.camDist = lv.cam.dist || 13.5;
    this.yawOff = 0; this.pitchOff = 0;
    const s = lv.spawn;
    this.teleport(s.x, s.y, s.z);
    this.p.yaw = Math.PI;
    if (this.p.model) { if (!this.p.model.parent) this.scene.add(this.p.model); this.p.model.visible = lv.showPlayer !== false; }
    if (this.kv) { if (!this.kv.parent) this.scene.add(this.kv); this.kv.visible = lv.showPlayer !== false; this.kv.position.set(s.x + 1, s.y + 2, s.z); }
    if (this.blob) this.blob.visible = lv.showPlayer !== false;
    this.snapCam();
  },
  clearLevel() {
    const lv = this.level;
    if (!lv) return;
    this.scene.remove(lv.group);
    lv.group.traverse((o) => {
      if (o.userData && o.userData.own) {
        if (o.geometry) o.geometry.dispose();
        if (o.material) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); }
      }
    });
    if (lv.skyTex) lv.skyTex.dispose();
    this.level = null; this.auto = null; this.tweens.length = 0; this.focusPos = null; this.lockInput = false;
    if (this.p) this.p.carry = null;
    UI.setPrompt(null); UI.actHud(null);
  },
  teleport(x, y, z) {
    const p = this.p;
    p.pos.set(x, y, z); p.vel.set(0, 0, 0); p.grounded = true; p.groundCol = null; p.safe.set(x, y, z); p.air = 0;
    this.auto = null;
  },
  snapCam() {
    const p = this.p;
    this.camTarget.set(p.pos.x, p.pos.y + 1.3 + ((this.level && this.level.camLift) || 0), p.pos.z);
    this.placeCam(1);
  },
  placeCam(k) {
    const yaw = this.camYaw + this.yawOff, pitch = clamp(this.camPitch + this.pitchOff, 0.25, 1.25);
    const d = this.camDist * (this.portrait ? 1.28 : 1);
    const cx = this.camTarget.x + Math.sin(yaw) * Math.cos(pitch) * d;
    const cy = this.camTarget.y + Math.sin(pitch) * d;
    const cz = this.camTarget.z + Math.cos(yaw) * Math.cos(pitch) * d;
    if (k >= 1) this.cam.position.set(cx, cy, cz);
    else { this.cam.position.x = lerp(this.cam.position.x, cx, k); this.cam.position.y = lerp(this.cam.position.y, cy, k); this.cam.position.z = lerp(this.cam.position.z, cz, k); }
    this.cam.lookAt(this.camTarget);
  },
  // short cinematic look at a point; resolves when the camera comes back
  focus(x, y, z, secs) {
    return new Promise((res) => {
      this.focusPos = new THREE.Vector3(x, y, z); this.focusT = secs || 1.6; this.focusRes = res; this.lockInput = true;
    });
  },
  tween(dur, fn, done) { this.tweens.push({ t: 0, dur, fn, done }); },
  addCol(c) { this.level.cols.push(c); return c; },
  removeCol(c) { const i = this.level.cols.indexOf(c); if (i >= 0) this.level.cols.splice(i, 1); },
  addInter(it) { this.level.inter.push(it); return it; },
  removeInter(it) { const i = this.level.inter.indexOf(it); if (i >= 0) this.level.inter.splice(i, 1); },

  groundAt(x, z, maxY) {
    const cols = this.level.cols;
    let best = null, by = -1e9;
    const m = 0.16;
    for (let i = 0; i < cols.length; i++) {
      const c = cols[i];
      if (c.walk === false) continue;
      if (x < c.x0 - m || x > c.x1 + m || z < c.z0 - m || z > c.z1 + m) continue;
      if (c.y1 > maxY || c.y1 < by) continue;
      by = c.y1; best = c;
    }
    return best;
  },
  groundWide(x, z, maxY) {
    let g = this.groundAt(x, z, maxY);
    const o = PH.r * 0.6;
    const pts = [[o, 0], [-o, 0], [0, o], [0, -o]];
    for (let i = 0; i < 4; i++) { const h2 = this.groundAt(x + pts[i][0], z + pts[i][1], maxY); if (h2 && (!g || h2.y1 > g.y1)) g = h2; }
    return g;
  },
  pushOut(pos, feet) {
    const cols = this.level.cols, r = PH.r;
    for (let it = 0; it < 2; it++) {
      for (let i = 0; i < cols.length; i++) {
        const c = cols[i];
        if (c.solid === false) continue;
        if (c.y1 <= feet + PH.step || c.y0 >= feet + PH.height) continue;
        const cx = clamp(pos.x, c.x0, c.x1), cz = clamp(pos.z, c.z0, c.z1);
        let dx = pos.x - cx, dz = pos.z - cz;
        const d2 = dx * dx + dz * dz;
        if (d2 >= r * r) continue;
        if (d2 > 1e-8) { const d = Math.sqrt(d2); pos.x += (dx / d) * (r - d); pos.z += (dz / d) * (r - d); }

  // ---------- path layout helper ----------
  path(x, z, y, heading) {
    const self = this;
    const D = { F: [0, -1], L: [-1, 0], R: [1, 0], B: [0, 1] };
    const P = { x, z, y: y || 0, h: heading || 'F', last: null };
    P.island = (w, d, o) => {
      const v = D[P.h];
      const ex = v[0] !== 0 ? d : w, ez = v[0] !== 0 ? w : d;
      const cx = P.x + v[0] * ex / 2, cz = P.z + v[1] * ez / 2;
      const r = self.island(cx, cz, ex, ez, P.y, o);
      r.enter = { x: P.x, z: P.z, h: P.h };
      self.lv.route.push({ x: cx, z: cz, y: P.y, w: ex, d: ez, island: true });
      P.x += v[0] * ex; P.z += v[1] * ez; P.last = r;
      return r;
    };
    P.exit = (dir, off) => {
      const r = P.last, v = D[dir]; off = off || 0;
      P.h = dir;
      P.x = r.x + v[0] * r.w / 2 + (v[0] === 0 ? off : 0);
      P.z = r.z + v[1] * r.d / 2 + (v[1] === 0 ? off : 0);
      self.lv.route.push({ x: P.x - v[0] * 1.2, z: P.z - v[1] * 1.2, y: P.y });
      return P;
    };
    P.bridge = (len, w, o) => {
      const v = D[P.h];
      const nx = P.x + v[0] * len, nz = P.z + v[1] * len;
      const br = self.bridge(P.x, P.z, nx, nz, P.y, w || 2.8, o);
      P.x = nx; P.z = nz;
      self.lv.route.push({ x: nx - v[0] * 0.6, z: nz - v[1] * 0.6, y: P.y });
      return br;
    };
    P.gate = (o) => {
      const v = D[P.h];
      return self.gate(P.x + v[0] * 0.5, P.z + v[1] * 0.5, P.y, Object.assign({ axis: v[0] !== 0 ? 'z' : 'x', w: 2.8 }, o || {}));
    };
    P.stones = (n, gap, size, rise) => {
      const v = D[P.h], out = []; gap = gap || 1.3; size = size || 1.9; rise = rise || 0;
      for (let i = 0; i < n; i++) {
        P.y += rise;
        const cx = P.x + v[0] * (gap + size / 2), cz = P.z + v[1] * (gap + size / 2);
        out.push(self.stone(cx, cz, P.y, size));
        self.lv.route.push({ x: cx, z: cz, y: P.y });
        P.x += v[0] * (gap + size); P.z += v[1] * (gap + size);
      }
      P.x += v[0] * gap; P.z += v[1] * gap;
      return out;
    };
    P.stairs = (n, rise, w) => {
      const v = D[P.h]; rise = rise == null ? 0.45 : rise; w = w || 3;
      const th = self.lv.theme;
      for (let i = 0; i < n; i++) {
        P.y += rise;
        const cx = P.x + v[0] * 0.5, cz = P.z + v[1] * 0.5;
        const bw = v[0] !== 0 ? 1 : w, bd = v[0] !== 0 ? w : 1;
        self.box(cx, P.y - 0.6, cz, bw, 1.2, bd, i % 2 ? th.trim : th.top, { pick: true });
        self.col(cx - bw / 2, cx + bw / 2, P.y - 1.2, P.y, cz - bd / 2, cz + bd / 2, { solid: true });
        self.grow(cx, cz, bw, bd);
        P.x += v[0]; P.z += v[1];
      }
      self.lv.route.push({ x: P.x - v[0] * 0.4, z: P.z - v[1] * 0.4, y: P.y });
    };
    P.gap = (len, o) => { const v = D[P.h]; P.x += v[0] * len; P.z += v[1] * len; self.lv.route.push(Object.assign({ x: P.x + v[0] * 0.8, z: P.z + v[1] * 0.8, y: P.y, nojump: true }, o || {})); };
    return P;
  }
};

const ACT = {};

// floating cube with a caption, used for tokens and chunks
function tokenCube(text, sub, color, size) {
  const g = new THREE.Group();
  const s = size || 0.8;
  const m = mesh('box', color); m.scale.setScalar(s); m.castShadow = true; g.add(m);
  const e = mesh('box', COL.ink, { basic: true, opacity: 0.18 }); e.scale.setScalar(s * 1.08); g.add(e);
  const t = textTex(text, { px: 34, bg: null, color: '#1b2340' });
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: t.tex, transparent: true, depthWrite: false }));
  sp.scale.set(0.72 * t.aspect, 0.72, 1); t.onRedraw = (a) => sp.scale.set(0.72 * a, 0.72, 1);
  sp.position.y = s * 0.5 + 0.55; sp.userData.own = true; g.add(sp);
  if (sub) {
    const t2 = textTex(sub, { px: 22, font: 'mono', bg: '#1b2340', color: '#f4f6fb', border: null, pad: 6, radius: 8 });
    const sp2 = new THREE.Sprite(new THREE.SpriteMaterial({ map: t2.tex, transparent: true, depthWrite: false }));
    sp2.scale.set(0.42 * t2.aspect, 0.42, 1); t2.onRedraw = (a) => sp2.scale.set(0.42 * a, 0.42, 1);
    sp2.position.y = -s * 0.5 - 0.3; sp2.userData.own = true; g.add(sp2);
  }
  g.userData.box = m;
  return g;
}

// W1: collect the token cubes that hop out of the tokenizer
ACT.cubes = (ctx, o) => {
  const lv = ctx.lv;
  const cc = [COL.blue, COL.orange, COL.green, COL.gold];
  let active = false, got = 0;
  const items = o.items.map((it, i) => {
    const g = tokenCube(it.text, 'ID ' + it.id, cc[i % 4]);
    g.position.set(it.x, it.y, it.z); g.visible = false; lv.group.add(g);
    return { g, it, got: false, ph: i * 1.3 };
  });
  const hud = () => UI.actHud('收集托克切好的 <b>詞元方塊</b>　<span class="big">' + got + ' / ' + items.length + '</span>');
  const nextAnchor = () => { const n = items.find((q) => !q.got); if (n) ctx.anchor(o.id, n.it.x, n.it.z, n.it.y - 1); };
  const reveal = (quiet) => {
    active = true;
    items.forEach((q, i) => {
      q.g.visible = true;
      if (!quiet) { q.g.scale.setScalar(0.01); E.tween(0.5 + i * 0.12, (k) => q.g.scale.setScalar(easeOut(k))); E.fx.burst(q.it.x, q.it.y, q.it.z, cc[i % 4], 14, 3, 0.8); }
    });
    nextAnchor();
  };
  if (ctx.done(o.id)) return;
  if (ctx.done(o.after)) reveal(true); else ctx.onDone(o.after, () => { reveal(false); UI.say([['kv', '看！切好的 token 跳出來了。每一塊上面是文字，下面是它的 <b>token ID</b>。'], ['kv', '把四塊都收集起來。最後一塊在木箱上，要<b>跳</b>上去喔。']]); });
  lv.updates.push((dt, t) => {
    if (!active) return;
    const p = E.p.pos;
    let near = false;
    items.forEach((q) => {
      if (q.got) return;
      q.g.rotation.y = t * 1.2 + q.ph; q.g.position.y = q.it.y + Math.sin(t * 2.2 + q.ph) * 0.12;
      const dx = q.it.x - p.x, dy = q.it.y - (p.y + 0.8), dz = q.it.z - p.z;
      if (dx * dx + dz * dz < 144) near = true;
      if (dx * dx + dy * dy + dz * dz < 1.5) {
        q.got = true; q.g.visible = false; got++;
        AU.sfx('coin', got); E.fx.burst(q.it.x, q.it.y, q.it.z, COL.gold, 22, 4, 0.8);
        UI.toast('拿到「' + q.it.text + '」　token ID ' + q.it.id, 'good', 1600);
        nextAnchor();
        if (got === items.length) { active = false; UI.actHud(null); ctx.complete(o.id, 3); UI.say([['kv', '四個 token 到手：15、82、36、91。這些編號只是<b>索引</b>，還不能拿來算。'], ['kv', '下一步，拿它們去<b>嵌入表</b>換成向量！']]); }
      }
    });
    if (active) { if (near) hud(); else UI.actHud(null); }
  });
};

function ownMat(color, o) {
  const m = new THREE.MeshLambertMaterial(Object.assign({ color }, o || {}));

}
function ownBox(x, y, z, w, hgt, d, color, geoName, o) {

  m.position.set(x, y, z); m.scale.set(w, hgt, d); m.receiveShadow = true; m.userData.own = true;
  B.lv.group.add(m);

}
// a small pedestal you can press E at

// W2: jump on floor tiles to light the causal mask
ACT.floor = (ctx, o) => {
  const lv = ctx.lv, n = o.toks.length, S = 2.0, P2 = 2.2, y = o.y || 0;
  const OFF = 0xcfc3a0, ON = COL.gold, BAD = COL.rose, GOOD = COL.green;
  const tiles = [];
  let fails = 0, solved = ctx.done(o.id), flash = 0;
  const tx = (c) => o.cx + (c - (n - 1) / 2) * P2, tz = (r) => o.cz + (r - (n - 1) / 2) * P2;
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    const m = ownBox(tx(c), y + 0.1, tz(r), S, 0.2, S, OFF);
    lv.pick.push(m);
    const col = B.col(tx(c) - S / 2, tx(c) + S / 2, y - 0.3, y + 0.2, tz(r) - S / 2, tz(r) + S / 2, { solid: true });
    const t = { r, c, m, col, on: false };
    col.tile = t; tiles.push(t);
  }
  o.toks.forEach((tk, i) => {
    B.label('Q ' + tk, o.cx - (n / 2) * P2 - 1.3, y + 0.75, tz(i), { h: 0.62, px: 28, bg: '#c9d6f5' });
    B.label('K ' + tk, tx(i), y + 0.9, o.cz - (n / 2) * P2 - 0.9, { h: 0.62, px: 28, bg: '#fbdcc0' });
  });
  const paint = () => tiles.forEach((t) => t.m.material.color.setHex(solved ? (t.c <= t.r ? GOOD : OFF) : t.bad ? BAD : t.on ? ON : OFF));
  if (solved) tiles.forEach((t) => { t.on = t.c <= t.r; });
  paint();
  const lit = () => tiles.filter((t) => t.on).length;
  lv.onLand.push((g) => {
    if (solved || !g.tile) return;
    const t = g.tile; t.on = !t.on; t.bad = false; paint();
    AU.sfx(t.on ? 'pick' : 'drop'); E.fx.burst(t.m.position.x, y + 0.4, t.m.position.z, t.on ? ON : 0xffffff, 12, 2.5, 0.5);
  });
  const win = (stars) => {
    solved = true; paint(); AU.sfx('open');
    tiles.forEach((t) => { if (t.c <= t.r) E.fx.burst(t.m.position.x, y + 0.5, t.m.position.z, GOOD, 8, 3, 0.9); });
    UI.actHud(null);
    ctx.complete(o.id, stars);
    UI.say([['att', '這就是<b>因果遮罩</b>。每個 token 只能參考自己和前面的 token，所以亮起來的是<b>下三角</b>，對角線也算。'], ['kv', '注意！因為後面的 token 看不到、也改不了前面的計算，前面算好的 K、V 才可以<b>留下來重用</b>。']]);
  };
  const check = () => {
    const wrong = tiles.filter((t) => t.on !== (t.c <= t.r));
    if (!wrong.length) { win(fails === 0 ? 3 : fails <= 2 ? 2 : 1); return; }
    fails++; AU.sfx('bad');
    wrong.forEach((t) => { if (t.on) t.bad = true; });
    paint(); flash = 1.4;
    const miss = wrong.filter((t) => !t.on).length, extra = wrong.filter((t) => t.on).length;
    UI.toast((extra ? '紅色的 ' + extra + ' 格不該亮（那是「未來」的 token）。' : '') + (miss ? '還有 ' + miss + ' 格該亮沒亮。' : ''), 'bad', 3200);
    if (fails === 2) UI.say([['kv', '提示：站在某一列，問自己「這個 Q 能看到哪些 K？」答案是<b>自己，和排在它前面的所有 token</b>。']]);
  };
  const demo = () => { tiles.forEach((t) => { t.on = t.c <= t.r; t.bad = false; }); win(1); };
  button3d(o.check.x, o.check.z, y, '檢查遮罩');
  lv.inter.push({ x: o.check.x, y, z: o.check.z, r: 2.2, acts: () => (solved ? null : fails >= 2 ? [{ label: '檢查遮罩', fn: check }, { label: '請凱薇示範', fn: demo }] : [{ label: '檢查遮罩', fn: check }]) });
  ctx.anchor(o.id, o.check.x, o.check.z, y);
  lv.updates.push((dt) => {
    if (flash > 0) { flash -= dt; if (flash <= 0) { tiles.forEach((t) => { if (t.bad) { t.bad = false; t.on = false; } }); paint(); } }
    if (solved) return;
    const p = E.p.pos, near = Math.abs(p.x - o.cx) < n * P2 / 2 + 4.5 && Math.abs(p.z - o.cz) < n * P2 / 2 + 4.5;
    if (near) UI.actHud('站到地磚上<b>原地跳一下</b>，點亮「這個 Q 可以參考的 K」。完成後到金色按鈕檢查。<div class="row"><span class="pill">已點亮 ' + lit() + ' 格</span></div>');
    else UI.actHud(null);
  });
  lv.debug = lv.debug || {};
  lv.debug[o.id] = { tiles, check, target: (t) => t.c <= t.r };
};

// W3: generate three tokens without and then with a KV cache
ACT.run = (ctx, o) => {
  const lv = ctx.lv, y = o.y || 0, names = ['x₁', 'x₂', 'x₃', 'y₁', 'y₂', 'y₃'];
  const DARK = 0x3a4470, LIT = COL.gold, CACHED = COL.cyan, NEXT = 0xffffff;
  let phase = ctx.done(o.id) ? 'done' : 'A', round = 0, expect = 0, count = 0, busy = false;
  const pads = names.map((nm, i) => {
    const z = o.z0 - i * o.dz;
    const m = ownBox(o.x, y + 0.09, z, 1.15, 0.18, 1.15, DARK, 'cyl');
    B.decal(nm, o.x + 2.1, y, z, { h: 0.95, color: i < 3 ? '#8fb4ff' : '#ffc08a', font: 'mono' });
    const cry = B.box(o.x, y + 1.5, z, 0.34, 0.5, 0.34, CACHED, { geo: 'oct', phong: true, flat: true, emissive: 0x1f5f8f, cast: false });
    cry.visible = false;
    return { i, z, m, cry, lit: false, cached: false, shown: i < 3 };
  });
  const paint = () => pads.forEach((p) => {
    p.m.visible = p.shown; p.cry.visible = p.cached && p.shown;
    p.m.material.color.setHex(p.cached ? CACHED : p.lit ? LIT : DARK);
    p.m.material.emissive.setHex(p.cached ? 0x1f5f8f : p.lit ? 0x6a4a00 : 0x000000);
  });
  const need = () => (phase === 'A' ? 3 + round : round === 0 ? 3 : 1);
  const firstIdx = () => (phase === 'B' && round > 0 ? 2 + round : 0);
  if (phase === 'done') pads.forEach((p) => { p.shown = true; p.cached = p.i < 5; });
  paint();
  const hud = () => {
    if (phase === 'A') {
      const seq = pads.slice(0, 3 + round).map((p) => names[p.i]).join(' → ');
      UI.actHud('<b>沒有 KV Cache</b>　第 ' + (round + 1) + '／3 輪：依序踩過 ' + seq + '，才能生成 ' + names[3 + round] + '<div class="row"><span class="pill">已計算 token</span><span class="big">' + count + ' 次</span></div>');
    } else if (phase === 'B') {
      const seq = round === 0 ? 'x₁ → x₂ → x₃（prefill）' : '只踩新的 ' + names[2 + round];
      UI.actHud('<b>裝上 KV Cache</b>　第 ' + (round + 1) + '／3 輪：' + seq + '，就能生成 ' + names[3 + round] + '<div class="row"><span class="pill">已計算 token</span><span class="big">' + count + ' 次</span><span class="pill">剛才沒快取：12 次</span></div>');
    }
  };
  const finishRound = async () => {
    busy = true;
    const out = pads[3 + round];
    out.shown = true; AU.sfx('ok');
    E.fx.burst(o.x, y + 1, out.z, COL.orange, 26, 4, 0.9);
    UI.toast('生成了 ' + names[out.i] + '！', 'good', 1400);
    if (phase === 'A') {
      await sleep(700);
      pads.forEach((p) => { p.lit = false; });
      round++; expect = 0;
      if (round === 3) {
        paint(); UI.actHud(null);
        await UI.say([['cac', '呼……三個 token 就算了 <b>3 + 4 + 5 = 12</b> 次。每一輪都把整段前文從頭重算。'], ['kv', '其實 x₁、x₂、x₃ 的 K 和 V，第一輪就算過了。因果遮罩保證它們不會被後面的 token 改變。'], ['cac', '所以把算過的 K、V 存進水晶就好。這就是 <b>KV Cache</b>！回到起點再跑一次看看。']]);
        phase = 'B'; round = 0; expect = 0; count = 0;
        pads.forEach((p) => { p.shown = p.i < 3; p.lit = false; p.cached = false; });
        ctx.anchor(o.id, o.x, pads[0].z, y);
      } else UI.toast('沒有快取：剛剛算的全部丟掉了，回到 x₁ 重來', 'warn', 2400);
    } else {
      pads.forEach((p) => { if (p.lit) { p.cached = true; p.lit = false; } });
      round++; expect = firstIdx();
      if (round === 3) {
        phase = 'done'; paint(); UI.actHud(null);
        ctx.complete(o.id, 3);
        await UI.say([['kv', '這次只算了 <b>3 + 1 + 1 = 5</b> 次！舊 token 的 K、V 直接從快取讀，新 token 只算自己。'], ['cac', '一開始一次處理整段輸入叫 <b>prefill</b>，之後一個一個生成叫 <b>decode</b>。輸入越長，prefill 就越久，使用者等第一個字的時間（TTFT）也越久。'], ['kv', '記住這個痛點。CacheBlend 要對付的就是<b>又長又貴的 prefill</b>。']]);
      }
    }
    paint(); busy = false;
  };
  ctx.anchor(o.id, o.x, pads[0].z, y);
  lv.updates.push((dt, t) => {
    if (phase === 'done') return;
    const p = E.p.pos;
    const near = Math.abs(p.x - o.x) < 7 && p.z < o.z0 + 6 && p.z > o.z0 - 5 * o.dz - 5;
    if (!near) { UI.actHud(null); return; }
    if (busy) return;
    hud();
    const pad = pads[expect];
    if (!pad) return;
    const s = 1.15 + Math.sin(t * 7) * 0.09;
    pads.forEach((q) => { q.m.scale.x = q.m.scale.z = q === pad ? s : 1.15; });
    if (!pad.lit) pad.m.material.emissive.setHex(Math.sin(t * 7) > 0 ? 0x554400 : 0x000000);
    if (E.p.grounded && Math.hypot(p.x - o.x, p.z - pad.z) < 0.95) {
      pad.lit = true; count++; AU.sfx('compute', expect); E.fx.burst(o.x, y + 0.3, pad.z, LIT, 10, 2.5, 0.5);
      // with a cache, the new token attends to the stored K and V
      if (phase === 'B' && round > 0) pads.forEach((q) => { if (q.cached) E.fx.burst(o.x, y + 1.5, q.z, CACHED, 6, 1.5, 0.6); });
      expect++;
      const last = phase === 'A' ? need() : firstIdx() + need();
      paint();
      if (expect >= last) finishRound();
    }
  });
  lv.debug = lv.debug || {};
  lv.debug[o.id] = { pads, state: () => ({ phase, round, expect, count, busy }) };
};

// W4: act as the retriever. Carry the top-k chunks to the prompt desk.
ACT.fetch = (ctx, o) => {
  const lv = ctx.lv, y = o.y || 0, K = o.k || 2;
  let solved = ctx.done(o.id), fails = 0;
  const carried = [];
  const books = o.books.map((b, i) => {
    B.box(b.x, y + 0.45, b.z, 0.62, 0.9, 0.62, 0x6a4a3a, { geo: 'cyl' });
    B.col(b.x - 0.4, b.x + 0.4, y, y + 1.2, b.z - 0.4, b.z + 0.4, { solid: true, walk: false });
    const g = new THREE.Group();
    const cover = mesh('box', b.color); cover.scale.set(0.8, 1.05, 0.24); cover.castShadow = true; g.add(cover);
    const pages = mesh('box', COL.paper); pages.scale.set(0.7, 0.95, 0.27); pages.position.x = 0.03; g.add(pages);
    const t = textTex(b.id, { px: 40, bg: '#1b2340', color: '#f4f6fb', border: '#f4f6fb', pad: 8, radius: 10, font: 'mono' });
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: t.tex, transparent: true, depthWrite: false }));
    sp.scale.set(0.6 * t.aspect, 0.6, 1); t.onRedraw = (a) => sp.scale.set(0.6 * a, 0.6, 1); sp.position.y = 1.05; sp.userData.own = true; g.add(sp);
    g.position.set(b.x, y + 1.6, b.z); lv.group.add(g);
    const bk = Object.assign({ g, home: new THREE.Vector3(b.x, y + 1.6, b.z), ph: i * 1.1 }, b);
    bk.inter = { x: b.x, y, z: b.z, r: 1.9, noAuto: false, acts: () => {
      if (solved || carried.indexOf(bk) >= 0) return null;
      if (carried.length >= K) return [{ label: '手上已經有 ' + K + ' 塊了（top-k = ' + K + '）', fn: () => UI.toast('先把手上的區塊交給提示桌，或在提示桌按「全部放回去」。', 'warn') }];
      return [{ label: '拿起區塊 ' + bk.id, fn: () => { carried.push(bk); AU.sfx('pick'); E.fx.burst(bk.g.position.x, bk.g.position.y, bk.g.position.z, bk.color, 12, 2.5, 0.5); } }];
    } };
    lv.inter.push(bk.inter);
    return bk;
  });
  // prompt desk
  B.box(o.desk.x, y + 0.5, o.desk.z, 3.2, 1.0, 1.5, 0x7a5a3a, { solid: true, walk: false });
  B.box(o.desk.x, y + 1.03, o.desk.z, 3.4, 0.08, 1.7, 0x9a7448);
  B.label('提示桌 Prompt', o.desk.x, y + 2.1, o.desk.z, { h: 0.55, px: 26 });
  // the oracle's question board
  B.box(o.board.x, y + 2.1, o.board.z, 7.2, 2.6, 0.2, COL.ink);

  const ans = B.label('神諭 LLM：……', o.board.x, y + 1.6, o.board.z + 0.14, { h: 0.52, px: 26, bg: null, color: '#ffd166', depthTest: false });

    await UI.say([['rag', (carried.length < K ? '檢索器要取回 top-' + K + '，也就是 ' + K + ' 個區塊。' : '') + '神諭說：「' + (o.wrong[miss[0]] || '資料不夠。') + '」'], ['kv', fails >= 2 ? '提示：每本書靠近時都會顯示它和問題的 <b>L2 距離</b>。距離<b>越小</b>代表越相關，挑最小的兩個。' : '靠近每本書看看它的內容和 L2 距離，再挑一次。']]);

  } });

// W5: prefix-cache bridges. For each segment decide: reuse the cached KV, or compute it again.
ACT.bridge = (ctx, o) => {
  const lv = ctx.lv, L = 2.7, W = 2.8;
  const CACHED = COL.cyan, FRESH = COL.gold;
  let solved = ctx.done(o.id), fails = 0, waste = 0, busy = false;
  const mkCol = (c, z) => lv.cols.push({ x0: c.x - W / 2, x1: c.x + W / 2, y0: c.y - 0.4, y1: c.y, z0: z - L / 2, z1: z + L / 2, solid: true });
  const crossings = o.crossings.map((c) => {
    const segs = c.segs.map((sg, i) => {
      const z = c.z0 - (i + 0.5) * L;
      const m = ownBox(c.x, c.y - 0.2, z, W, 0.4, L - 0.16, 0xffffff, 'box', { transparent: true, opacity: 0.22, depthWrite: false });
      B.label(sg.name, c.x, c.y + 1.45, z, { h: 0.56, px: 26, bg: sg.bg || '#f4f6fb' });
      const s = Object.assign({ m, z, solid: false }, sg);
      if (solved) { s.solid = true; m.material.opacity = 1; m.material.transparent = false; m.material.depthWrite = true; m.material.color.setHex(sg.reuse ? CACHED : FRESH); mkCol(c, z); lv.pick.push(m); }
      return s;
    });
    B.box(c.x - 3.6, c.y + 1.2, c.z0 + 1.3, 0.16, 2.4, 0.16, COL.ink, { solid: true, walk: false });
    B.label('快取裡有　' + c.cached + '\n這次輸入　' + c.now, c.x - 3.6, c.y + 3.1, c.z0 + 1.3, { h: 1.25, px: 24, font: 'body' });
    const cr = { c, segs, next: solved ? segs.length : 0, cost: 0 };
    cr.inter = { x: c.x, y: c.y, z: c.z0 + 0.55, r: 1.7, acts: () => (busy || cr.next >= segs.length ? null : [{ label: '沿用快取', fn: () => reuse(cr) }, { label: '重新計算', fn: () => compute(cr) }]) };
    lv.inter.push(cr.inter);
    return cr;
  });
  const current = () => crossings.find((cr) => cr.next < cr.segs.length);
  const setAnchor = () => { const cr = current(); if (cr) ctx.anchor(o.id, cr.inter.x, cr.inter.z, cr.c.y); };
  const finish = async () => {
    solved = true; UI.actHud(null);
    const bad = fails + waste;
    ctx.complete(o.id, bad === 0 ? 3 : bad <= 2 ? 2 : 1);
    await UI.say(o.win);
  };
  const solidify = (cr, how) => {
    const sg = cr.segs[cr.next], c = cr.c;
    sg.solid = true;
    const mt = sg.m.material; mt.opacity = 1; mt.transparent = false; mt.depthWrite = true; mt.color.setHex(how === 'reuse' ? CACHED : FRESH); mt.needsUpdate = true;
    mkCol(c, sg.z); lv.pick.push(sg.m);
    E.fx.burst(c.x, c.y + 0.3, sg.z, how === 'reuse' ? CACHED : FRESH, 22, 3.5, 0.8);
    cr.next++;
    cr.inter.z = c.z0 - cr.next * L + 0.55;
    setAnchor();
    if (!current()) finish();
  };
  const reuse = (cr) => {
    const sg = cr.segs[cr.next];
    if (sg.reuse) { AU.sfx('ok'); UI.toast('沿用成功：到「' + sg.name + '」為止，都和快取的前綴一模一樣', 'good', 2200); solidify(cr, 'reuse'); return; }
    fails++; AU.sfx('crumble');
    const y0 = sg.m.position.y;
    sg.m.material.color.setHex(COL.rose); sg.m.material.opacity = 0.7;
    E.tween(0.7, (k) => { sg.m.position.y = y0 - k * 2.5; sg.m.rotation.z = Math.sin(k * 20) * 0.12; }, () => { sg.m.position.y = y0; sg.m.rotation.z = 0; sg.m.material.color.setHex(0xffffff); sg.m.material.opacity = 0.22; });
    UI.say([['pre', '橋面碎掉了！' + sg.why], ['kv', '這一段只能<b>重新計算</b>。']]);
  };
  const compute = (cr) => {
    const sg = cr.segs[cr.next];
    busy = true; E.lockInput = true;
    const dur = 0.5 + sg.cost * 0.32;
    let last = -1;
    E.tween(dur, (k) => { sg.m.material.opacity = 0.22 + k * 0.6; const q = Math.floor(k * 8); if (q !== last) { last = q; AU.sfx('compute', q); } UI.actHud('<b>Prefill 中…</b>　正在計算「' + sg.name + '」的 KV<div class="meter"><i style="width:' + Math.round(k * 100) + '%;background:var(--gold)"></i></div>'); }, () => {
      busy = false; E.lockInput = false; cr.cost += sg.cost;
      if (sg.reuse) { waste++; UI.toast('算好了。不過這一段和快取的前綴完全相同，其實可以直接沿用，不必花時間', 'warn', 3200); }
      solidify(cr, 'compute');
    });
  };
  setAnchor();
  lv.updates.push(() => {
    if (solved || busy) return;
    const p = E.p.pos;
    const cr = crossings.find((q) => Math.abs(p.x - q.c.x) < 7 && p.z < q.c.z0 + 5 && p.z > q.c.z0 - q.segs.length * L - 2);
    if (!cr) { UI.actHud(null); return; }
    const nx = cr.segs[cr.next];
    UI.actHud('<div class="opt"><div><i>快取裡有</i>' + cr.c.cached + '</div><div><i>這次輸入</i>' + cr.c.now + '</div></div><div class="row">' + (nx ? '<span class="pill">下一段：' + nx.name + '</span>' : '<span class="pill">過橋吧！</span>') + '<span class="pill">這座橋的 prefill 花費 ' + cr.cost + '</span></div>');
  });
  lv.debug = lv.debug || {};
  lv.debug[o.id] = { crossings, state: () => ({ busy, solved }) };
};

// ---- 09d-activities.js ----
// ===== activity for world 6 =====
// W6: find the high-KV-deviation tokens and recompute only those.
ACT.hunt = (ctx, o) => {
  const lv = ctx.lv, y = o.y || 0, BUDGET = o.budget;
  let solved = ctx.done(o.id), fails = 0, judged = false;
  const total = o.tokens.reduce((a, t) => a + t.dev, 0);
  const maxDev = Math.max.apply(null, o.tokens.map((t) => t.dev));
  const toks = o.tokens.map((t) => {
    const base = B.box(t.x, y + 0.1, t.z, 1.7, 0.2, 1.7, t.chunk === 1 ? COL.blue : COL.orange, { cast: false });
    const m = ownBox(t.x, y + 0.75, t.z, 1.25, 1.1, 1.25, COL.reuse);
    m.castShadow = true;
    B.label(t.text, t.x, y + 1.75, t.z, { h: 0.5, px: 26, bg: t.chunk === 1 ? '#c9d6f5' : '#fbdcc0' });
    const hgt = 0.2 + (t.dev / maxDev) * 1.5;
    const bar = B.box(t.x, y + 2.25 + hgt / 2, t.z, 0.42, hgt, 0.42, t.dev > 5 ? COL.rose : t.dev > 0 ? COL.gold : COL.green, { basic: true, cast: false });
    const num = B.label(t.dev.toFixed(1), t.x, y + 2.62 + hgt, t.z, { h: 0.42, px: 24, font: 'mono', bg: '#1b2340', color: '#f4f6fb', border: null });
    bar.visible = false; num.visible = false;
    B.col(t.x - 0.62, t.x + 0.62, y, y + 1.3, t.z - 0.62, t.z + 0.62, { solid: true, walk: false });
    const tk = Object.assign({ m, bar, num, seen: false, rc: false }, t);
    tk.inter = { x: t.x, y, z: t.z + 0.2, r: 1.75, acts: () => {
      if (solved || judged) return null;
      if (tk.rc) return [{ label: '取消重算「' + tk.text + '」', fn: () => { tk.rc = false; paint(); AU.sfx('drop'); } }];
      if (left() <= 0) return [{ label: '重算額度用完了（先取消一個）', fn: () => UI.toast('額度只有 ' + BUDGET + ' 個。走到已重算的 token 旁邊可以取消。', 'warn') }];
      return [{ label: '重算「' + tk.text + '」', fn: () => { tk.rc = true; paint(); AU.sfx('zap'); E.fx.burst(tk.x, y + 1, tk.z, 0xffffff, 24, 4, 0.7); if (left() === 0) judge(); } }];
    } };
    lv.inter.push(tk.inter);
    return tk;
  });
  const left = () => BUDGET - toks.filter((t) => t.rc).length;
  const deviation = () => toks.reduce((a, t) => a + (t.rc ? 0 : t.dev), 0) / total;
  const paint = () => toks.forEach((t) => { t.m.material.color.setHex(t.rc ? 0x4a5060 : COL.reuse); t.m.material.emissive.setHex(t.rc ? 0x000000 : 0x5a5a5a); t.bar.visible = t.num.visible = t.seen || solved; });
  if (solved) { toks.forEach((t) => { t.seen = true; }); toks.slice().sort((a, b) => b.dev - a.dev).slice(0, BUDGET).forEach((t) => { t.rc = true; }); }
  paint();
  const judge = async () => {
    judged = true;
    const d = deviation();
    await sleep(500);
    if (d <= o.target) {
      solved = true; AU.sfx('open'); UI.actHud(null); paint();
      ctx.complete(o.id, fails === 0 ? 3 : fails === 1 ? 2 : 1);
      await UI.say(o.win);
    } else {
      fails++; AU.sfx('bad');
      await UI.say([['ble', '注意力偏差還有 <b>' + d.toFixed(2) + '</b>，神諭的回答還是在繞圈子。'], ['kv', fails >= 2 ? '提示：每個 token 都走近看一下，找出長條<b>最高的三個</b>。藍色那排是輸入的前綴，偏差是 0，不用管。' : '額度有限，要花在<b>偏差最高</b>的 token 上。先把每個 token 都看過一遍再決定。']]);
      toks.forEach((t) => { t.rc = false; });
      paint(); judged = false;
    }
  };
  ctx.anchor(o.id, o.cx, o.cz + 3, y);
  lv.updates.push(() => {
    if (solved) return;
    const p = E.p.pos;
    if (Math.abs(p.x - o.cx) > o.rx || Math.abs(p.z - o.cz) > o.rz) { UI.actHud(null); return; }
    let near = null;
    toks.forEach((t) => { const d = Math.hypot(p.x - t.x, p.z - t.z); if (d < 2.3) { if (!t.seen) { t.seen = true; t.bar.visible = t.num.visible = true; AU.sfx('tick'); } if (!near || d < near.d) near = { t, d }; } });
    const d = deviation();
    const ansOk = d <= o.target;
    const dots = '●'.repeat(left()) + '○'.repeat(BUDGET - left());
    UI.actHud((near ? '<b>' + near.t.text + '</b>　KV 偏差 <b>' + near.t.dev.toFixed(1) + '</b>' + (near.t.chunk === 1 ? '（輸入的前綴，預先算好的 KV 本來就正確）' : '') : '走近每個 token，量量它的 <b>KV 偏差</b>；挑 ' + BUDGET + ' 個來重算') +
      '<div class="row"><span class="pill">重算額度 ' + dots + '</span><span class="pill">注意力偏差 ' + d.toFixed(2) + '</span></div><div class="meter"><i style="width:' + Math.round(d * 100) + '%;background:' + (ansOk ? 'var(--green)' : 'var(--rose)') + '"></i></div>' +
      '<div class="opt"><div><i>神諭</i>' + (ansOk ? o.good : o.bad) + '</div></div>');
  });
  lv.debug = lv.debug || {};
  lv.debug[o.id] = { toks, state: () => ({ solved, judged }) };
};

// ---- 09e-activities.js ----
// ===== activity for world 7 =====
// W7: be one request and travel through the CacheBlend system in the right order (Fig. 11).
ACT.flow = (ctx, o) => {
  const lv = ctx.lv, y = o.y || 0;
  let step = ctx.done(o.id) ? o.order.length : 0, fails = 0, wrongHere = 0, busy = false;
  const cubes = o.carry.map((c) => { const g = tokenCube(c[0], null, c[1], 0.7); g.visible = false; lv.group.add(g); return g; });
  const setCarry = (i) => { cubes.forEach((g, k) => { g.visible = k === i; }); E.p.carry = i >= 0 && i < cubes.length ? cubes[i] : null; };
  const stops = {};
  o.stops.forEach((s) => {
    const g = new THREE.Group(); g.position.set(s.x, y, s.z); lv.group.add(g);
    const P = (geoName, color, px, py, pz, sx, sy, sz, mo) => { const m = mesh(geoName, color, mo); m.position.set(px, py, pz); m.scale.set(sx, sy, sz); m.castShadow = true; g.add(m); return m; };
    let spin = null;
    if (s.key === 'user') { P('box', 0xf7e7c6, 0, 1, 0, 2.4, 2, 2.2); const r = P('cone4', COL.rose, 0, 2.6, 0, 2.1, 1.3, 2); r.rotation.y = Math.PI / 4; P('box', 0x8fe8ff, 0, 1.2, 1.12, 1.2, 0.8, 0.06, { basic: true }); }
    else if (s.key === 'ctrl') { P('box', 0x5f6f7f, 0, 1.6, 0, 1.6, 3.2, 1.6); P('box', COL.ink, 0, 3.6, 0, 2.6, 1.0, 2.6); P('box', 0xffe9a8, 0, 3.6, 1.32, 2.2, 0.6, 0.06, { basic: true }); P('cyl', COL.ink, 0, 4.6, 0, 0.06, 1.2, 0.06); spin = P('oct', COL.green, 0, 5.3, 0, 0.3, 0.3, 0.3, { basic: true }); }
    else if (s.key === 'ret') { P('box', 0x6a4a3a, 0, 1.3, 0, 3, 2.6, 0.9); [0x5b7fd6, 0xec8b3c, 0x4fa866, 0xd9544f, 0xf2b632, 0x5b7fd6, 0x4fa866].forEach((c, i) => { P('box', c, -1.2 + i * 0.4, 1.9, 0.5, 0.3, 0.9, 0.1); P('box', c, -1.2 + i * 0.4, 0.8, 0.5, 0.3, 0.8, 0.1); }); }
    else if (s.key === 'store') { [[0x5b7fd6, 'CPU RAM'], [0x4fa866, 'SSD'], [0x6b7280, '慢速磁碟']].forEach((c, i) => { P('box', c[0], -2.2 + i * 2.2, 0.9, 0, 2, 1.8, 2.2); P('box', shade(c[0], 0.7), -2.2 + i * 2.2, 0.9, 0, 2.06, 0.2, 2.26); B.label(c[1], s.x - 2.2 + i * 2.2, y + 2.3, s.z, { h: 0.42, px: 22, font: 'mono' }); }); }
    else if (s.key === 'fusor') { P('cyl', COL.ink, 0, 0.5, 0, 1.2, 1, 1.2); P('cyl', 0xbfe6ff, 0, 2, 0, 0.95, 2, 0.95, { opacity: 0.45 }); P('cyl', COL.ink, 0, 3.1, 0, 1.0, 0.2, 1.0); spin = P('box', COL.green, 0, 1.4, 0, 1.4, 0.12, 0.3, { basic: true }); P('oct', COL.green, 0.9, 3.6, 0, 0.26, 0.26, 0.26, { basic: true }); }
    else if (s.key === 'llm') { P('box', 0x2f3b68, 0, 2, 0, 2.6, 4, 1.6); P('box', 0x8fe8ff, 0, 2.6, 0.82, 1.9, 1.5, 0.06, { basic: true }); P('box', COL.ink, -0.45, 2.8, 0.86, 0.3, 0.4, 0.04); P('box', COL.ink, 0.45, 2.8, 0.86, 0.3, 0.4, 0.04); P('box', COL.gold, 0, 4.3, 0, 1.2, 0.5, 1, { phong: true, flat: true, geo: 'box' }); }
    B.label(s.name, s.x, y + (s.lh || 4.6), s.z, { h: 0.6, px: 28 });
    const hw = s.hw || 1.4, hd = s.hd || 1.3;
    B.col(s.x - hw, s.x + hw, y, y + 3, s.z - hd, s.z + hd, { solid: true, walk: false });
    const st = { s, spin };
    st.inter = { x: s.x, y, z: s.z + hd + 0.9, r: 2.5, acts: () => {
      if (busy || step >= o.order.length) return null;
      return [{ label: step === 0 ? (s.key === 'user' ? '接下使用者的問題' : '和「' + s.name + '」互動') : '把「' + o.carry[step - 1][0] + '」帶到：' + s.name, fn: () => visit(s.key) }];
    } };
    lv.inter.push(st.inter);
    if (spin) lv.anims.push((dt, t) => { spin.rotation.y = t * 3; });
    stops[s.key] = st;
  });
  const anchorNext = () => { const k = o.order[step]; if (k) ctx.anchor(o.id, stops[k].inter.x, stops[k].inter.z, y); };
  const visit = async (key) => {
    if (key !== o.order[step]) {
      fails++; wrongHere++; AU.sfx('bad');
      UI.toast(wrongHere >= 2 ? '提示：' + o.hints[step] : '還不是這裡。想想「' + (step === 0 ? '請求' : o.carry[step - 1][0]) + '」接下來該交給誰？', 'bad', 3400);
      return;
    }
    busy = true; wrongHere = 0;
    const st = stops[key];
    AU.sfx('ok'); E.fx.burst(st.s.x, y + 2, st.s.z + 1, COL.green, 26, 4, 0.8);
    const i = step; step++;
    setCarry(step - 1 < cubes.length ? step - 1 : -1);
    if (step >= o.order.length) {
      setCarry(-1); UI.actHud(null);
      ctx.complete(o.id, fails === 0 ? 3 : fails <= 2 ? 2 : 1);
      await UI.say(o.says[i].concat(o.win));
    } else { await UI.say(o.says[i]); anchorNext(); }
    busy = false;

// W8: predict where the four methods land, then watch them race (Fig. 12).
ACT.race = (ctx, o) => {
  const lv = ctx.lv, y = o.y || 0;
  let state = ctx.done(o.id) ? 'done' : 'idle';
  const runners = o.lanes.map((ln, i) => {
    const z = o.z0 + i * o.dz;
    B.box((o.x0 + o.x1) / 2, y + 0.02, z, o.x1 - o.x0 + 3, 0.04, o.dz - 0.5, i % 2 ? 0xd9c9a8 : 0xcfbe98, { cast: false });
    const r = makeRobot({ accent: ln.color, trim: ln.color, s: 0.95 });
    r.position.set(o.x0, y, z); r.rotation.y = Math.PI / 2; lv.group.add(r);
    const name = B.label(ln.name, o.x0, y + 2.5, z, { h: 0.5, px: 24, bg: '#1b2340', color: '#f4f6fb', border: '#f4f6fb' });
    const res = B.label('　', o.x1 + 2.6, y + 1.2, z, { h: 0.5, px: 24, font: 'mono' });
    res.visible = false;
    return { ln, r, z, name, res, t: 0, done: state === 'done' };
  });
  B.box(o.x1 + 0.4, y + 0.03, o.z0 + ((o.lanes.length - 1) * o.dz) / 2, 0.5, 0.05, o.lanes.length * o.dz, COL.ink, { cast: false });
  B.box(o.x0 - 0.9, y + 0.03, o.z0 + ((o.lanes.length - 1) * o.dz) / 2, 0.3, 0.05, o.lanes.length * o.dz, COL.paper, { cast: false });
  const setRes = (q, txt, bg) => {
    const t = textTex(txt, { px: 24, font: 'mono', bg: bg || '#f4f6fb' });
    q.res.material.map.dispose(); q.res.material.map = t.tex; q.res.scale.set(0.5 * t.aspect, 0.5, 1); t.onRedraw = (a) => q.res.scale.set(0.5 * a, 0.5, 1); q.res.visible = true;
  };
  const park = () => runners.forEach((q) => { q.r.position.x = o.x1; q.name.position.x = o.x1; setRes(q, 'TTFT ' + q.ln.ttft.toFixed(2) + 's　F1 ' + q.ln.f1.toFixed(2), q.ln.f1 < 0.25 ? '#f8d2cf' : '#cdebd4'); });
  if (state === 'done') park();
  button3d(o.board.x, o.board.z, y, '預測台', COL.rose);
  const startRace = (stars) => {
    state = 'racing';
    const K = 2.6, longest = Math.max.apply(null, o.lanes.map((l) => l.ttft)) * K;
    UI.actHud('<b>Prefill 競速！</b>　誰先送出第一個 token？');
    AU.sfx('roar');
    E.focus((o.x0 + o.x1) / 2, y + 1, o.z0 + ((o.lanes.length - 1) * o.dz) / 2, longest + 3.2).then(async () => {
      state = 'done'; UI.actHud(null);
      ctx.complete(o.id, stars);
      await UI.say(o.win);
    });
    let t = 0, judged = false;
    lv.updates.push((dt) => {
      if (state !== 'racing') return;
      t += dt;
      runners.forEach((q) => {
        const dur = q.ln.ttft * K, k = Math.min(1, t / dur);
        q.r.position.x = lerp(o.x0, o.x1, k); q.name.position.x = q.r.position.x;
        animRobot(q.r, E.t, k < 1 ? 1 : 0, true, dt);
        if (k >= 1 && !q.done) { q.done = true; AU.sfx('ok'); E.fx.burst(o.x1, y + 1, q.z, q.ln.color, 20, 4, 0.8); setRes(q, 'TTFT ' + q.ln.ttft.toFixed(2) + 's'); }
      });
      if (!judged && t > longest + 0.9) {
        judged = true; AU.sfx('star');
        runners.forEach((q) => setRes(q, 'TTFT ' + q.ln.ttft.toFixed(2) + 's　F1 ' + q.ln.f1.toFixed(2), q.ln.f1 < 0.25 ? '#f8d2cf' : '#cdebd4'));
        UI.actHud('<b>裁判亮分！</b>　跑得快還不夠，答案也要對。');
      }
    });
  };
  lv.inter.push({ x: o.board.x, y, z: o.board.z + 0.4, r: 2.3, acts: () => (state !== 'idle' ? null : [{ label: '賽前預測：四種方法各在哪裡', fn: async () => {
    const res = await NB.run(o.quiz, { key: ctx.wid + '.' + o.id + '.quiz', kicker: '預測完成', doneLabel: '開賽！' });
    if (res.done) startRace(res.stars);
  } }]) });
  ctx.anchor(o.id, o.board.x, o.board.z + 0.4, y);
  lv.anims.push((dt, t) => { if (state !== 'racing') runners.forEach((q) => animRobot(q.r, t, 0, true, dt)); });
  lv.updates.push(() => {
    if (state !== 'idle') return;
    const p = E.p.pos;
    if (Math.abs(p.x - (o.x0 + o.x1) / 2) < 19 && Math.abs(p.z - o.z0 - 3) < 12) UI.actHud('四位選手準備比 <b>TTFT</b>。開賽前，先到紅色的<b>預測台</b>押注。');
    else UI.actHud(null);
  });
  lv.debug = lv.debug || {};
  lv.debug[o.id] = { state: () => state };
};

  const wingL = new THREE.Group(); wingL.position.set(-2.4, 4, -0.4); D.add(wingL); P('box', dark, -2.2, 0, 0, 4.6, 0.16, 3, null, wingL);
  const wingR = new THREE.Group(); wingR.position.set(2.4, 4, -0.4); D.add(wingR); P('box', dark, 2.2, 0, 0, 4.6, 0.16, 3, null, wingR);
  P('cone', purple, 0, 1.4, -3.4, 1.2, 4.4, 1.2).rotation.x = -1.3;
  B.col(o.cx - 4.5, o.cx + 4.5, y, y + 7, o.cz - 14, o.cz - 8, { solid: true, walk: false });
  B.label(WHO.boss.name, o.cx, y + 10.2, o.cz - 11, { h: 0.7, px: 30, bg: '#3a2050', color: '#f4f6fb', border: '#f4f6fb' });
  let flinch = 0, dead = phase === 'done';

    if (!dead) head.rotation.y = Math.atan2(E.p.pos.x - o.cx, E.p.pos.z - (o.cz - 11)) * 0.6;
    flinch = Math.max(0, flinch - dt * 2);
    D.rotation.z = Math.sin(t * 40) * 0.06 * flinch;
    const es = 0.3 + Math.sin(t * 6) * 0.03; eyeL.scale.x = eyeR.scale.x = es;
  });
  // --- crystals ---
  const spots = [{ x: o.cx - 8.5, z: o.cz + 0.5 }, { x: o.cx, z: o.cz - 2.5 }, { x: o.cx + 8.5, z: o.cz + 0.5 }];
  const cols = [COL.blue, COL.orange, COL.green];
  const crystals = spots.map((s, i) => {
    const g = new THREE.Group(); g.position.set(s.x, y, s.z); lv.group.add(g);
    const gem = mesh('oct', cols[i], { phong: true, flat: true, emissive: shade(cols[i], 0.4) }); gem.scale.set(0.6, 0.95, 0.6); gem.position.y = 1.5; gem.castShadow = true; g.add(gem);
    const base = mesh('cyl', COL.ink); base.scale.set(0.8, 0.3, 0.8); base.position.y = 0.15; g.add(base);
    B.label('ABC'[i], 0, 3.0, 0, { parent: g, h: 0.75, px: 34, font: 'mono', bg: '#1b2340', color: '#f4f6fb', border: '#f4f6fb' });
    g.visible = false;
    const c = { g, gem, i, x: s.x, z: s.z, opt: null, alive: false };

    lv.anims.push((dt, t) => { gem.rotation.y = t * 1.5 + i; gem.position.y = 1.5 + Math.sin(t * 2.4 + i) * 0.14; });

  });
  // --- fireball warnings ---

  for (let i = 0; i < 3; i++) {
    const m = new THREE.Mesh(G('ring'), new THREE.MeshBasicMaterial({ color: 0xff5a2a, transparent: true, opacity: 0.85, depthWrite: false, side: THREE.DoubleSide }));
    m.rotation.x = -Math.PI / 2; m.visible = false; m.userData.own = true; lv.group.add(m);
    rings.push({ m, t: 0, on: false, x: 0, z: 0 });
  }

  const blade = new THREE.Group(); blade.position.set(o.cx, y, o.cz + 1); blade.visible = false; lv.group.add(blade);
  const bm = mesh('box', COL.orange, { phong: true, flat: true, emissive: 0x6a3000 }); bm.scale.set(0.3, 2.6, 0.08); bm.position.y = 2.4; blade.add(bm);
  const bg = mesh('box', COL.gold); bg.scale.set(1.1, 0.16, 0.2); bg.position.y = 1.05; blade.add(bg);
  const bh = mesh('cyl', COL.ink); bh.scale.set(0.09, 0.6, 0.09); bh.position.y = 0.7; blade.add(bh);
  const glow = makeGlow(COL.orange, 5); glow.position.y = 2.2; blade.add(glow);
  lv.anims.push((dt, t) => { blade.rotation.y = t * 1.2; });
  const bladeInter = { x: o.cx, y, z: o.cz + 1, r: 2.4, enabled: false, label: '舉起融合之刃', fn: () => seal() };
  lv.inter.push(bladeInter);

  const heartsStr = () => '♥'.repeat(hearts) + '<span style="opacity:.3">' + '♥'.repeat(Math.max(0, 5 - hearts)) + '</span>';
  const hud = () => {
    if (phase === 'round') {
      const r = o.rounds[round];
      UI.actHud('<div class="row"><span class="pill">魔龍 ' + '■'.repeat(hp) + '□'.repeat(o.rounds.length - hp) + '</span><span class="hearts">' + heartsStr() + '</span></div><b>魔龍：「' + r.claim + '」</b><div class="opt">' + crystals.filter((c) => c.alive).map((c) => '<div><i style="color:#' + cols[c.i].toString(16).padStart(6, '0') + '">' + 'ABC'[c.i] + '</i>' + c.opt[0] + '</div>').join('') + '</div>' + (moved ? '' : '<div class="row"><span class="pill">慢慢看。你一移動，魔龍才會開始吐火球</span></div>'), true);

  const knockout = async () => {

    rings.forEach((rg) => { rg.on = false; rg.m.visible = false; });

    await UI.say([['kv', '好險！我把你拉回來了。深呼吸，再聽一次牠說了什麼。']]);

  };
  const pick = async (c) => {
    if (phase !== 'round' || !c.alive) return;
    if (c.opt[1]) {
      phase = 'talk';
      crystals.forEach((q) => { q.alive = false; q.inter.enabled = false; if (q !== c) q.g.visible = false; });

      E.fx.burst(c.x, y + 1.5, c.z, cols[c.i], 30, 5, 0.8);

      } else startRound();

      AU.sfx('boom');

    const ck = 1 - Math.exp(-2 * dt);

    if (phase !== 'round' && phase !== 'seal') return;
    hud();
    if (phase !== 'round') return;
    inv = Math.max(0, inv - dt);
    if (!moved && startPos.distanceTo(E.p.pos) > 2.5) moved = true;
    if (!noFire && moved) {
      fireT -= dt;
      if (fireT <= 0) {
        fireT = Math.max(1.5, 2.9 - round * 0.2);
        const rg = rings.find((q) => !q.on);

      rg.m.scale.setScalar(0.4 + k * 1.5); rg.m.material.opacity = 0.4 + k * 0.5;

      }

  });
  lv.debug = lv.debug || {};
  lv.debug[o.id] = { state: () => ({ phase, round, hp, hearts }), crystals, setNoFire: (v) => { noFire = v; }, blade: { x: o.cx, z: o.cz + 1 } };
};

      const st = SV.stars(w.id, s.id);
      const li = h('li' + (st ? '.done' : ''), h('span.box', { html: st ? '✓' : '' }), h('span.t', s.name), h('span.st', st ? '★'.repeat(st) : ''));

      }
    };

    p.append(h('h3', w.name + '　任務清單'), list, h('div.qp-note', '金色箭頭會指向下一站。M：地圖　N：筆記本'));
  },
  async assist(s) {
    UI.toggleQuest(false);

  },
  refreshGates(quiet) {
    let first = null;

  async openStation(st) {

  completeStation(sid, stars) {

  },
  async worldGateCleared() {
    const w = this.world, lv = this.lv;

    AU.sfx('win');
    if (lv && lv.portal) { lv.portal.activate(); await E.focus(lv.portal.x, lv.portal.y + 2, lv.portal.z, 1.8); }

  async finishWorld() {
    const w = this.world;

  worldClearSheet(w) {
    const i = WORLDS.indexOf(w), next = WORLDS[i + 1];

      h('div.center', h('div.kicker', '融合之刃碎片 ' + this.fragments() + ' / 8'), h('div.row', { style: { justifyContent: 'center' } }, h('span.shards', Array.from({ length: 8 }, (_, k) => h('i' + (k < this.fragments() ? '.on' : ''))))),
        h('div.cert', h('div.stats', h('div', '★ ' + got + ' / ' + maxS, h('small', '星星')), h('div', '◆ ' + SV.crystals(w.id).length + ' / ' + ((SV.d.gt && SV.d.gt[w.id]) || 0), h('small', 'KV 晶體'))))),

      h('div.codex-list', learned.map((c) => h('div.codex-item', h('h4', c.t, h('small', c.en)), h('p', { html: c.d })))));

  },
  ending() {
    SV.d.done = 1; SV.save();
    const total = SV.totalStars(), maxS = WORLDS.reduce((a, w) => a + (w.stations.length + 1) * 3, 0);
    const pct = total / maxS;
    const rank = pct >= 0.95 ? '融合大師' : pct >= 0.8 ? '資深快取工程師' : pct >= 0.6 ? '快取工程師' : '見習快取工程師';

      h('div.stats', h('div', '★ ' + total + ' / ' + maxS, h('small', '星星')), h('div', '◆ ' + SV.totalCrystals(), h('small', 'KV 晶體')), h('div', mins + ' 分鐘', h('small', '冒險時間'))),
      h('div.kicker', { style: { marginTop: '10px' } }, '用四句話說完這篇論文'),

  },

  // ---------- notebook-only mode (no WebGL) ----------
  flatWorld(world) {
    const wid = world.id;
    const m = UI.sheet('第 ' + world.no + ' 世界　' + world.name, world.desc + '　' + world.lessons, { dismissible: false, tag: 'flat' });
    const draw = () => {
      m.body.innerHTML = '';

      const list = h('div.codex-list');
      let prevDone = true;
      const add = (s, def, isGate) => {
        const st = SV.stars(wid, s.id), open = prevDone || SV.d.opt.free || st;
        list.append(h('button.map-node' + (open ? '' : '.locked'), { disabled: !open, onclick: async () => {
          const res = await NB.run(def, { key: wid + '.' + s.id });

        SV.d.cleared[wid] && next && isReady(next) ? h('button.btn', { onclick: () => { m.close(); this.enterWorld(next.id); } }, '前往：' + next.name) : null,
        SV.d.cleared[wid] && !next ? h('button.btn', { onclick: () => { m.close(); this.ending(); } }, '結業') : null));
    };
    draw();
  },

  // ---------- notebook / settings ----------
  showCodex() {
    if (UI.dialogOpen || UI.modals.some((m) => m.opts.tag === 'codex')) return;
    const m = UI.sheet('筆記本', '走過的每一站都會留下一則筆記', { tag: 'codex' });
    const tabs = h('div.tabs');
    m.sheet.insertBefore(tabs, m.body);
    const show = (k) => {
      $$('button', tabs).forEach((b) => b.classList.toggle('on', b.dataset.k === k));
      m.body.innerHTML = ''; m.body.scrollTop = 0;
      if (k === 'notes') {
        let any = false;
        WORLDS.forEach((w) => {
          const ids = [];
          w.stations.concat([w.gate]).forEach((s) => { if (SV.isDone(w.id, s.id)) (s.codex || []).forEach((id) => ids.push(id)); });
          const all = Object.keys(CODEX).filter((id) => CODEX[id].w === w.id);
          if (!all.length) return;
          m.body.append(h('div.codex-group', '第 ' + w.no + ' 世界　' + w.name + '　' + ids.length + ' / ' + all.length));
          const list = h('div.codex-list');
          all.forEach((id) => { const c = CODEX[id], on = ids.indexOf(id) >= 0; if (on) any = true; list.append(on ? h('div.codex-item', h('h4', c.t, h('small', c.en)), h('p', { html: c.d })) : h('div.codex-item.locked', h('h4', '？？？'), h('p', '完成對應的站點後解鎖'))); });
          m.body.append(list);
        });
        if (!any) m.body.prepend(h('p.note', '還沒有筆記。完成第一站之後，新觀念會自動寫進這裡。'));
      } else if (k === 'figs') {
        m.body.append(h('p.note', '讀論文時逐圖對照：先找橫軸、縱軸、比較的方法和固定條件，再問它支持哪一個主張。頁碼是原稿頁碼。'));
        const list = h('div.codex-list');
        FIGS.forEach((f) => { const w = WORLDS.find((x) => x.id === f[4]); list.append(h('div.codex-item', h('h4', f[0], h('small', f[1] + (w ? '　第 ' + w.no + ' 世界' : ''))), h('p', { html: '<b>' + f[2] + '</b>　' + f[3] }))); });
        m.body.append(list);
      } else {
        m.body.append(h('p.note', '講義整理的五個提醒：原稿有幾處寫法需要特別辨認。'));
        const list = h('div.codex-list');
        CAUTIONS.forEach((c, i) => list.append(h('div.codex-item', h('h4', '提醒 ' + (i + 1)), h('p', c))));
        m.body.append(list);
      }
    };
    [['notes', '我的筆記'], ['figs', '論文圖表導覽'], ['care', '讀原稿的提醒']].forEach((t) => tabs.append(h('button', { data: { k: t[0] }, onclick: () => show(t[0]) }, t[1])));
    show('notes');
  },
  showSettings() {
    if (UI.dialogOpen || UI.modals.some((m) => m.opts.tag === 'set')) return;
    const m = UI.sheet('設定', '', { tag: 'set' });
    const seg = (opts, cur, fn) => { const s = h('div.seg'); opts.forEach((o) => { const b = h('button' + (o[0] === cur ? '.on' : ''), { onclick: () => { $$('button', s).forEach((x) => x.classList.remove('on')); b.classList.add('on'); AU.sfx('tap'); fn(o[0]); } }, o[1]); s.append(b); }); return s; };
    const o = SV.d.opt;
    const list = h('div.set-list',
      h('div.set-row', h('div', h('b', '音效')), seg([[1, '開'], [0, '關']], o.sfx ? 1 : 0, (v) => { o.sfx = v; AU.setSfx(!!v); SV.save(); })),
      h('div.set-row', h('div', h('b', '背景音樂')), seg([[1, '開'], [0, '關']], o.music ? 1 : 0, (v) => { o.music = v; AU.setMusic(!!v); SV.save(); })),
      this.mode3d ? h('div.set-row', h('div', h('b', '畫質'), h('div.d', '如果畫面卡頓，改成「省電」')), seg([['auto', '自動'], ['high', '高'], ['low', '省電']], o.q, (v) => { o.q = v; E.setQuality(v); SV.save(); })) : null,
      h('div.set-row', h('div', h('b', '自由模式'), h('div.d', '直接開放全部九個世界，方便複習')), seg([[0, '關'], [1, '開']], o.free ? 1 : 0, (v) => { o.free = v; SV.save(); })),
      h('div.set-row', h('div', h('b', '進度儲存'), h('div.d', CLOUD.on ? '已同步到你的 Claude 帳號，換裝置也讀得到' : '目前只存在這個瀏覽器裡')), h('button.btn.small.alt', { onclick: () => { m.close(); this.showRestore(); } }, '找回進度')),
      h('div.set-row', h('div', h('b', '操作方式'), h('div.keys', h('kbd', 'WASD / 方向鍵'), h('span', '移動（觸控：左下搖桿）'), h('kbd', '空白鍵'), h('span', '跳（觸控：右下按鈕）'), h('kbd', 'E'), h('span', '互動'), h('kbd', '點地面'), h('span', '自動走過去'), h('kbd', '拖曳 / 滾輪'), h('span', '轉動視角 / 拉遠拉近'), h('kbd', 'M · N'), h('span', '地圖 · 筆記本')))),
      this.wid && this.mode3d ? h('div.set-row', h('div', h('b', '卡住了？'), h('div.d', '把角色送回這個世界的起點')), h('button.btn.small.alt', { onclick: () => { const sp = this.lv.spawn; E.teleport(sp.x, sp.y, sp.z); E.snapCam(); m.close(); } }, '回到起點')) : null,
      this.wid ? h('div.set-row', h('div', h('b', '離開這個世界'), h('div.d', '已完成的站點都會保留')), h('button.btn.small.alt', { onclick: () => { m.close(); this.leaveWorld(); } }, '回世界地圖')) : null);
    m.body.append(list);
  },
  // ---------- getting progress back ----------
  // Progress lives in the browser that was used. If it is gone (another device, another way of opening
  // the page, cleared site data), the player can say how far they were and carry on from there.
  showRestore() {
    if (UI.dialogOpen || UI.modals.some((m) => m.opts.tag === 'restore')) return;
    const m = UI.sheet('找回進度', '進度不見了？從之前玩到的地方接著玩', { tag: 'restore' });
    m.body.append(
      h('p', '進度原本存在「當時玩的那個瀏覽器或 App」裡。換了裝置、換了開啟方式，或清除過網站資料，這裡就讀不到。'),
      h('p', { html: '選你<b>之前已經打完</b>的最後一個世界。它和它之前的世界會標記為通關，你可以直接從下一個世界接著玩。原有的進度不會被減少。' }));
    const list = h('div.codex-list');
    WORLDS.forEach((w, i) => {
      list.append(h('button.map-node', { onclick: () => { m.close(); this.restoreUpTo(i + 1); } },
        h('span.no', { style: { background: w.color } }, String(w.no)),
        h('span', h('div.nm', '我已經打完：' + w.name), h('div.ds', i < WORLDS.length - 1 ? '接著從第 ' + (w.no + 1) + ' 世界「' + WORLDS[i + 1].name + '」開始' : '九個世界全部標記為通關'))));
    });
    m.body.append(list);
  },
  restoreUpTo(n) {
    const d = SV.d;
    WORLDS.slice(0, n).forEach((w) => {
      w.stations.concat([w.gate]).forEach((s) => { const k = w.id + '.' + s.id; d.st[k] = Math.max(d.st[k] || 0, 3); });
      d.cleared[w.id] = 1; d.seen[w.id] = 1;
    });
    d.intro = 1;
    if (n >= WORLDS.length) d.done = 1;
    SV.save();
    this.onProgressChanged('進度已恢復到第 ' + n + ' 世界通關', true);
  },
  // progress changed from outside the current screen: redraw whatever is showing
  onProgressChanged(msg, openMap) {
    if (msg) UI.toast(msg, 'good', 3200);
    if (this.wid && this.lv) {
      Object.keys(this.lv.stations).forEach((sid) => this.lv.stations[sid].setDone(SV.isDone(this.wid, sid)));
      this.refreshGates(true);
      if (SV.isDone(this.wid, 'gate') && this.lv.portal && !this.lv.portal.active) this.lv.portal.activate(true);
      this.refreshHud();
      return;
    }
    if (this.wid) return;
    const map = UI.modals.find((m) => m.opts.tag === 'map');
    if (map) { map.opts.onClose = null; UI.closeModal(map); this.showMap(); return; }
    if (UI.modals.length) return;
    if (this.titleEl) { this.showTitle(); if (openMap) this.showMap(); }
  },
  async leaveWorld() {
    await UI.fade(true);
    if (this.mode3d) { E.mode = 'title'; E.setLevel(buildTitleLevel()); }
    UI.showHud(false); UI.actHud(null); UI.setPrompt(null);
    this.wid = null; this.world = null; this.lv = null;
    AU.music(MUSIC.title);
    await UI.fade(false);
    this.showMap();
  }
};
// ---------- boot ----------
function whenThree(cb) {
  if (window.THREE) { cb(); return; }
  let done = false, triedLocal = false;
  const finish = () => { if (!done) { done = true; cb(); } };
  const local = () => {
    if (window.THREE) { finish(); return; }
    if (triedLocal) return;
    triedLocal = true;
    const s = document.createElement('script');
    s.src = 'vendor/three.min.js'; s.onload = finish; s.onerror = finish;
    document.head.appendChild(s);
    setTimeout(finish, 6000);
  };
  const tag = document.querySelector('script[data-three]');
  if (tag) { tag.addEventListener('load', finish); tag.addEventListener('error', local); } else local();
  setTimeout(local, 7000);
  const iv = setInterval(() => { if (window.THREE) finish(); if (done) clearInterval(iv); }, 120);
}
function startGame(data) { whenThree(() => { try { GAME.boot(data || {}); } catch (e) { console.error(e); const ld = document.getElementById('loading'); if (ld) ld.textContent = '啟動失敗：' + e.message; } }); }
window.CBQ = { E, SV, UI, NB, GAME, WORLDS, AU, B, ACT, bus, READY };
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(startGame);
else startGame((window.claude && window.claude.hot && window.claude.hot.data) || {});

})();
