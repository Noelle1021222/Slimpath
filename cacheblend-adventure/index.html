<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>CacheBlend 大冒險</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-screen game. A full-bleed 3D diorama sits behind a HUD of ink chips;
   every lesson opens as a page of quad-ruled field notebook. Colours follow the
   paper's own figure legend: chunk 1 blue, chunk 2 orange, chunk 3 green,
   re-used KV white, re-computed KV grey. Single visual world by choice (no dark variant). */
:root {
  color-scheme: light;
  --ink: #1b2340;
  --ink-2: #2f3b68;
  --ink-soft: #55608a;
  --paper: #f4f6fb;
  --paper-2: #e7ecf7;
  --grid: #d3dcf0;
  --blue: #5b7fd6;
  --blue-soft: #c9d6f5;
  --orange: #ec8b3c;
  --orange-soft: #fbdcc0;
  --green: #4fa866;
  --green-soft: #cdebd4;
  --rose: #d9544f;
  --rose-soft: #f8d2cf;
  --gold: #f2b632;
  --reuse: #ffffff;
  --recomp: #6b7280;
  --sky: #18203f;
  --font-display: "LXGW WenKai TC", "Noto Serif TC", "Kaiti TC", "DFKai-SB", "Songti TC", serif;
  --font-body: "Chiron GoRound TC", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Heiti TC", sans-serif;
  --font-mono: "JetBrains Mono", "SF Mono", Menlo, Consolas, "Noto Sans TC", monospace;
}

html { box-sizing: border-box; overflow: hidden; }
html, body { height: 100%; }
body {
  background: var(--sky);
  color: var(--paper);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.65;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#app {
  position: fixed; inset: 0; overflow: hidden;
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
  --gt: calc(10px + env(safe-area-inset-top, 0px));
  --gb: calc(12px + env(safe-area-inset-bottom, 0px));
  user-select: none; -webkit-user-select: none;
}
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
#nogl-bg { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 100%, #f0a36b 0%, #7a5aa6 38%, #18203f 78%); }

button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
svg { display: block; }

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
#hud > * { pointer-events: auto; }
.hud-top {
  position: absolute; top: var(--gt); left: var(--gl); right: var(--gr);
  display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; pointer-events: none;
}
.hud-top > * { pointer-events: auto; }
.chip {
  display: inline-flex; align-items: center; gap: 8px; min-height: 40px;
  padding: 6px 14px; border-radius: 12px;
  background: rgba(22, 29, 58, .82); color: var(--paper);
  border: 2px solid rgba(244, 246, 251, .22);
  box-shadow: 0 3px 0 rgba(10, 14, 32, .55);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  font-size: 14px; line-height: 1.3; text-align: left;
}
#btn-quest { max-width: min(56vw, 360px); flex-direction: column; align-items: flex-start; gap: 0; }
#btn-quest .q-world { font-family: var(--font-display); font-weight: 700; font-size: 15px; color: var(--gold); letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
#btn-quest .q-goal { font-size: 13px; opacity: .95; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.hud-right { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.counter { font-family: var(--font-mono); font-weight: 700; font-variant-numeric: tabular-nums; padding: 6px 10px; }
.counter svg { width: 18px; height: 18px; }
.icon-btn { width: 44px; height: 44px; padding: 0; justify-content: center; }
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn:active, .chip:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(10, 14, 32, .55); }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.28); } 100% { transform: scale(1); } }
.bump { animation: bump .32s ease-out; }

#quest-panel {
  position: absolute; top: calc(var(--gt) + 52px); left: var(--gl);
  width: min(340px, calc(100% - var(--gl) - var(--gr)));
  max-height: 55%; overflow: auto;
  background: rgba(22, 29, 58, .93); border: 2px solid rgba(244, 246, 251, .22); border-radius: 14px;
  padding: 12px 14px; font-size: 14px;
}
#quest-panel h3 { margin: 0 0 6px; font-family: var(--font-display); font-size: 16px; color: var(--gold); }
#quest-panel ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
#quest-panel li { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; }
#quest-panel li .box { width: 18px; height: 18px; border: 2px solid var(--paper); border-radius: 4px; display: grid; place-items: center; font-size: 12px; line-height: 1; }
#quest-panel li.done .box { background: var(--green); border-color: var(--green); }
#quest-panel li.done span.t { opacity: .6; }
#quest-panel li .st { font-family: var(--font-mono); font-size: 12px; color: var(--gold); letter-spacing: 1px; }
#quest-panel .qp-note { margin-top: 8px; font-size: 12px; opacity: .75; }

#prompt { position: absolute; left: 50%; bottom: calc(var(--gb) + 96px); transform: translateX(-50%); max-width: calc(100% - var(--gl) - var(--gr)); }
#btn-interact {
  display: inline-flex; align-items: center; gap: 10px; padding: 10px 18px 10px 12px; border-radius: 14px;
  background: var(--orange); color: var(--ink); font-weight: 700; font-size: 16px;
  border: 2px solid var(--ink); box-shadow: 0 4px 0 var(--ink);
  max-width: 100%;
}
#btn-interact:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
#btn-interact .key { font-family: var(--font-mono); font-size: 13px; background: var(--ink); color: var(--paper); border-radius: 6px; padding: 1px 7px; }
#btn-interact .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#prompt.two { display: flex; gap: 10px; }
.act-btn {
  padding: 10px 16px; border-radius: 14px; font-weight: 700; font-size: 16px; color: var(--ink);
  border: 2px solid var(--ink); box-shadow: 0 4px 0 var(--ink); background: var(--paper);
}
.act-btn.a { background: var(--green-soft); }
.act-btn.b { background: var(--orange); }
.act-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }

#touch { position: absolute; inset: 0; pointer-events: none; }
#stick {
  position: absolute; left: calc(var(--gl) + 6px); bottom: calc(var(--gb) + 10px);
  width: 128px; height: 128px; border-radius: 50%;
  background: rgba(22, 29, 58, .42); border: 2px solid rgba(244, 246, 251, .35);
  pointer-events: auto; touch-action: none;
}
#stick-knob {
  position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%;
  background: rgba(244, 246, 251, .88); border: 2px solid var(--ink); box-shadow: 0 3px 0 rgba(10, 14, 32, .5);
}
#btn-jump {
  position: absolute; right: calc(var(--gr) + 6px); bottom: calc(var(--gb) + 22px);
  width: 84px; height: 84px; border-radius: 50%;
  background: rgba(91, 127, 214, .9); color: #fff; font-weight: 700; font-size: 18px; font-family: var(--font-display);
  border: 2px solid var(--ink); box-shadow: 0 4px 0 var(--ink); pointer-events: auto; touch-action: none;
}
#btn-jump:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
#app:not(.touch) #touch { display: none; }
#app.touch #prompt { bottom: calc(var(--gb) + 150px); }

#act-hud {
  position: absolute; top: calc(var(--gt) + 56px); left: 50%; transform: translateX(-50%);
  width: min(560px, calc(100% - var(--gl) - var(--gr)));
  background: rgba(22, 29, 58, .88); border: 2px solid rgba(244, 246, 251, .22); border-radius: 14px;
  padding: 10px 14px; font-size: 14px; line-height: 1.5; text-align: center; pointer-events: none;
}
#act-hud b { color: var(--gold); }
#act-hud .big { font-family: var(--font-mono); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
#act-hud .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; align-items: center; }
#act-hud .meter { height: 12px; border-radius: 6px; background: rgba(244, 246, 251, .18); overflow: hidden; margin-top: 6px; }
#act-hud .meter > i { display: block; height: 100%; background: var(--rose); transition: width .4s ease, background .4s; }
#act-hud .pill { display: inline-block; padding: 1px 9px; border-radius: 999px; background: rgba(244, 246, 251, .16); font-family: var(--font-mono); font-size: 13px; }
#act-hud .opt { text-align: left; display: grid; gap: 4px; margin-top: 6px; }
#act-hud .opt div { padding: 4px 8px; border-radius: 8px; background: rgba(244, 246, 251, .1); }
#act-hud .opt i { font-style: normal; font-family: var(--font-mono); font-weight: 700; margin-right: 6px; }
#act-hud .hearts { letter-spacing: 2px; color: var(--rose); }
#app.touch #act-hud { font-size: 13px; }

/* ---------- Dialog ---------- */
#dialog {
  position: absolute; left: 50%; bottom: var(--gb); transform: translateX(-50%); z-index: 20;
  width: min(760px, calc(100% - var(--gl) - var(--gr)));
  background: rgba(22, 29, 58, .96); color: var(--paper);
  border: 2px solid var(--paper); border-radius: 16px; box-shadow: 0 5px 0 rgba(10, 14, 32, .7);
  padding: 14px 16px 12px; cursor: pointer;
  display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: start;
}
#dialog .face {
  width: 52px; height: 52px; border-radius: 14px; border: 2px solid var(--paper); background: var(--blue);
  position: relative; overflow: hidden;
}
#dialog .face::before, #dialog .face::after {
  content: ""; position: absolute; top: 20px; width: 8px; height: 12px; border-radius: 4px; background: var(--ink);
}
#dialog .face::before { left: 12px; } #dialog .face::after { right: 12px; }
#dialog .who { font-family: var(--font-display); font-weight: 700; color: var(--gold); font-size: 15px; letter-spacing: .06em; }
#dialog .txt { font-size: 16px; line-height: 1.6; min-height: 3.2em; text-wrap: pretty; }
#dialog .txt b { color: var(--gold); font-weight: 700; }
#dialog .more { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; font-size: 12px; opacity: .8; }
#dialog .more .skip { text-decoration: underline; padding: 6px 2px; }
@keyframes nudge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
#dialog .more .tap { animation: nudge 1s infinite; }

/* ---------- Toasts ---------- */
#toasts { position: absolute; top: calc(var(--gt) + 58px); left: 50%; transform: translateX(-50%); z-index: 45; display: grid; gap: 8px; justify-items: center; pointer-events: none; width: min(520px, calc(100% - 32px)); }
.toast {
  background: var(--paper); color: var(--ink); border: 2px solid var(--ink); border-radius: 12px; box-shadow: 0 4px 0 var(--ink);
  padding: 8px 14px; font-weight: 700; font-size: 15px; text-align: center;
  animation: toast-in .25s ease-out;
}
.toast.good { background: var(--green-soft); } .toast.warn { background: var(--orange-soft); } .toast.bad { background: var(--rose-soft); }
.toast.out { opacity: 0; transform: translateY(-8px); transition: all .3s; }
@keyframes toast-in { from { opacity: 0; transform: translateY(-10px) scale(.96); } to { opacity: 1; transform: none; } }

/* ---------- Modal shell ---------- */
#modal-root { position: absolute; inset: 0; z-index: 30; pointer-events: none; }
.modal {
  position: absolute; inset: 0; pointer-events: auto;
  display: flex; align-items: center; justify-content: center;
  padding: var(--gt) var(--gr) var(--gb) var(--gl);
  background: rgba(14, 19, 40, .5);
}
.sheet {
  width: min(760px, 100%); max-height: 100%;
  display: flex; flex-direction: column; min-height: 0;
  background-color: var(--paper); color: var(--ink);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px; background-position: -1px -1px;
  border: 2px solid var(--ink); border-radius: 18px; box-shadow: 0 7px 0 var(--ink);
  overflow: hidden; user-select: text; -webkit-user-select: text;
  animation: sheet-in .22s ease-out;
}
@keyframes sheet-in { from { transform: translateY(14px) scale(.985); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet-head {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 16px;
  background: var(--ink); color: var(--paper);
}
.sheet-head h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: .04em; flex: 1; min-width: 0; text-wrap: balance; line-height: 1.3; }
.sheet-head .sub { font-size: 12px; opacity: .75; font-family: var(--font-body); font-weight: 400; display: block; letter-spacing: 0; }
.sheet-head .x { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: rgba(244, 246, 251, .12); flex: none; }
.sheet-head .x svg { width: 18px; height: 18px; }
.dots { display: flex; gap: 4px; flex-wrap: wrap; max-width: 130px; justify-content: flex-end; }
.dots i { width: 11px; height: 11px; border: 2px solid var(--paper); border-radius: 3px; display: block; }
.dots i.done { background: var(--green); border-color: var(--green); }
.dots i.cur { background: var(--gold); border-color: var(--gold); }
.sheet-body { padding: 16px 18px 8px; overflow-y: auto; min-height: 0; flex: 1; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.sheet-foot { padding: 10px 16px 14px; display: grid; gap: 10px; border-top: 2px dashed var(--grid); background: rgba(244, 246, 251, .92); }
.foot-row { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.foot-links { display: flex; gap: 14px; font-size: 14px; }
.foot-links button { text-decoration: underline; color: var(--ink-soft); padding: 6px 0; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px;
  padding: 8px 22px; border-radius: 12px; font-weight: 700; font-size: 16px;
  background: var(--orange); color: var(--ink); border: 2px solid var(--ink); box-shadow: 0 4px 0 var(--ink);
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn.alt { background: var(--paper); }
.btn.blue { background: var(--blue); color: #fff; }
.btn.green { background: var(--green); color: #fff; }
.btn.small { min-height: 36px; padding: 4px 14px; font-size: 14px; box-shadow: 0 3px 0 var(--ink); }
.btn[disabled] { opacity: .45; pointer-events: none; }

.fb { border-radius: 12px; padding: 10px 12px 10px 14px; font-size: 15px; line-height: 1.6; border: 2px solid var(--ink); background: var(--paper); border-left-width: 10px; }
.fb.ok { border-color: var(--green); background: var(--green-soft); }
.fb.bad { border-color: var(--rose); background: var(--rose-soft); }
.fb.hint { border-color: var(--gold); background: #fdf1cf; }
.fb b { font-weight: 700; }

/* ---------- Notebook content ---------- */
.nb h3 { font-family: var(--font-display); font-weight: 700; font-size: 21px; margin: 0 0 8px; line-height: 1.35; text-wrap: balance; }
.nb p { margin: 0 0 10px; max-width: 38em; text-wrap: pretty; }
.nb .q { font-weight: 700; font-size: 17px; margin: 0 0 12px; line-height: 1.55; }
.nb .lead { font-size: 17px; }
.nb .note { font-size: 13.5px; color: var(--ink-soft); }
.nb ul, .nb ol.plain { margin: 0 0 10px; padding-left: 1.3em; max-width: 38em; }
.nb li { margin-bottom: 4px; }
.nb code, .mono { font-family: var(--font-mono); font-size: .92em; background: var(--paper-2); border-radius: 5px; padding: 1px 5px; white-space: nowrap; }
.nb .term { font-weight: 700; background: linear-gradient(transparent 58%, #ffe08a 58%); padding: 0 1px; }
.nb .c1 { background: linear-gradient(transparent 58%, var(--blue-soft) 58%); font-weight: 700; }
.nb .c2 { background: linear-gradient(transparent 58%, var(--orange-soft) 58%); font-weight: 700; }
.nb .c3 { background: linear-gradient(transparent 58%, var(--green-soft) 58%); font-weight: 700; }
.nb .kicker { font-family: var(--font-mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 2px; }
.nb .fig { margin: 6px 0 12px; overflow-x: auto; }
.nb .fig svg { max-width: 100%; height: auto; }
.nb .cap { font-size: 13px; color: var(--ink-soft); margin: -6px 0 12px; }
.nb table.t { border-collapse: collapse; font-size: 14.5px; margin: 4px 0 12px; background: rgba(255, 255, 255, .7); }
.nb table.t th, .nb table.t td { border: 1.5px solid var(--ink); padding: 5px 9px; text-align: left; vertical-align: top; }
.nb table.t th { background: var(--paper-2); font-weight: 700; }
.nb .tw { overflow-x: auto; }
.card { background: rgba(255, 255, 255, .78); border: 2px solid var(--ink); border-radius: 12px; padding: 10px 12px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grow { flex: 1; min-width: 0; }

.opts { display: grid; gap: 9px; }
.opt-b {
  display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; text-align: left;
  padding: 10px 12px; border-radius: 12px; background: #fff; border: 2px solid var(--ink); box-shadow: 0 3px 0 var(--ink);
  font-size: 15.5px; line-height: 1.55; color: var(--ink);
}
.opt-b .k { width: 28px; height: 28px; border-radius: 7px; background: var(--paper-2); border: 2px solid var(--ink); display: grid; place-items: center; font-family: var(--font-mono); font-weight: 700; font-size: 14px; }
.opt-b:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.opt-b.sel { background: var(--blue-soft); }
.opt-b.ok { background: var(--green-soft); border-color: var(--green); box-shadow: 0 3px 0 var(--green); }
.opt-b.ok .k { background: var(--green); color: #fff; border-color: var(--green); }
.opt-b.no { background: var(--rose-soft); border-color: var(--rose); box-shadow: none; opacity: .75; pointer-events: none; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.shake { animation: shake .25s linear 2; }

.pool, .seq { display: flex; flex-wrap: wrap; gap: 8px; min-height: 48px; padding: 8px; border-radius: 12px; }
.seq { border: 2px dashed var(--ink-soft); background: rgba(255, 255, 255, .6); flex-direction: column; flex-wrap: nowrap; }
.tok {
  display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 10px; background: #fff; text-align: left;
  border: 2px solid var(--ink); box-shadow: 0 3px 0 var(--ink); font-size: 15px; line-height: 1.45; color: var(--ink);
}
.tok:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.tok .n { font-family: var(--font-mono); font-weight: 700; background: var(--ink); color: var(--paper); border-radius: 6px; padding: 0 7px; flex: none; }
.tok.used { opacity: .28; pointer-events: none; box-shadow: none; }
.tok.ok { background: var(--green-soft); border-color: var(--green); box-shadow: 0 3px 0 var(--green); }
.tok.no { background: var(--rose-soft); border-color: var(--rose); }
.tok.sel { background: var(--gold); }
.tok.c1 { background: var(--blue-soft); } .tok.c2 { background: var(--orange-soft); } .tok.c3 { background: var(--green-soft); }
.seq-empty { color: var(--ink-soft); font-size: 14px; padding: 4px; }

.match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; align-items: stretch; }
.match .tok { width: 100%; min-height: 48px; }
.match .tok.done { opacity: .9; pointer-events: none; }
.match .tag { font-family: var(--font-mono); font-weight: 700; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: #fff; flex: none; font-size: 12px; }
@media (max-width: 520px) { .match { gap: 8px 8px; } .match .tok { font-size: 14px; padding: 6px 8px; } }

.bucket-card { font-size: 17px; font-weight: 700; text-align: center; padding: 16px 12px; min-height: 76px; display: grid; place-items: center; }
.buckets { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-top: 12px; }
.buckets .btn { min-height: 56px; background: var(--paper); font-size: 15px; padding: 6px 10px; line-height: 1.35; }
.bucket-prog { font-family: var(--font-mono); font-size: 13px; color: var(--ink-soft); text-align: center; margin-top: 8px; }
.bucket-done { display: grid; gap: 6px; margin-top: 10px; font-size: 14px; }
.bucket-done div { display: flex; gap: 8px; align-items: baseline; }

const AU = {
  ctx: null, master: null, sfxG: null, musG: null,
  sfxOn: true, musOn: true, theme: null, timer: null, step: 0, nextT: 0,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {}); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.9; this.master.connect(this.ctx.destination);
      this.sfxG = this.ctx.createGain(); this.sfxG.gain.value = this.sfxOn ? 1 : 0; this.sfxG.connect(this.master);
      this.musG = this.ctx.createGain(); this.musG.gain.value = this.musOn ? 1 : 0; this.musG.connect(this.master);
      const len = this.ctx.sampleRate * 0.4;
      this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { this.ctx = null; }
  },
  setSfx(on) { this.sfxOn = on; if (this.sfxG) this.sfxG.gain.value = on ? 1 : 0; },
  setMusic(on) { this.musOn = on; if (this.musG) this.musG.gain.value = on ? 1 : 0; },
  tone(freq, dur, type, vol, when, slide, dest) {

    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol || 0.1), t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(dest || this.sfxG);

  noise(dur, vol, when, freq, q) {

  sfx(name, p) {

      case 'step': this.noise(0.05, 0.035, 0, 500 + Math.random() * 300, 1.2); break;
      case 'jump': T(300, 0.18, 'square', 0.05, 0, 620); break;
      case 'land': this.noise(0.09, 0.07, 0, 240, 0.7); break;
      case 'coin': { const b = 660 * Math.pow(1.06, Math.min(p || 0, 10)); T(b, 0.08, 'triangle', 0.1); T(b * 1.5, 0.16, 'triangle', 0.1, 0.07); break; }
      case 'ok': T(523, 0.1, 'triangle', 0.11); T(659, 0.1, 'triangle', 0.11, 0.09); T(784, 0.2, 'triangle', 0.11, 0.18); break;
      case 'bad': T(196, 0.16, 'sawtooth', 0.06); T(156, 0.24, 'sawtooth', 0.06, 0.13); break;
      case 'tap': T(880, 0.04, 'sine', 0.05); break;
      case 'page': this.noise(0.14, 0.05, 0, 2200, 0.5); break;
      case 'open': T(392, 0.12, 'triangle', 0.1); T(523, 0.12, 'triangle', 0.1, 0.1); T(659, 0.12, 'triangle', 0.1, 0.2); T(1046, 0.4, 'sine', 0.1, 0.3); break;
      case 'gate': T(110, 0.5, 'sawtooth', 0.05, 0, 55); this.noise(0.5, 0.05, 0, 300, 0.4); T(880, 0.5, 'sine', 0.07, 0.25); break;
      case 'star': T(1046, 0.1, 'sine', 0.1); T(1318, 0.1, 'sine', 0.1, 0.08); T(1568, 0.3, 'sine', 0.1, 0.16); break;
      case 'win': [523, 659, 784, 1046, 784, 1046, 1318].forEach((f, i) => T(f, i === 6 ? 0.6 : 0.14, 'triangle', 0.11, i * 0.12)); break;
      case 'hit': T(160, 0.2, 'square', 0.09, 0, 60); this.noise(0.2, 0.1, 0, 400, 0.5); break;
      case 'zap': T(1400, 0.25, 'sawtooth', 0.05, 0, 200); break;
      case 'boom': this.noise(0.6, 0.16, 0, 120, 0.4); T(80, 0.6, 'sine', 0.16, 0, 30); break;
      case 'pick': T(440, 0.06, 'square', 0.05); T(660, 0.1, 'square', 0.05, 0.05); break;
      case 'drop': T(330, 0.12, 'square', 0.05, 0, 200); break;
      case 'tick': T(1200, 0.03, 'square', 0.03); break;
      case 'crumble': this.noise(0.5, 0.12, 0, 180, 0.3); T(140, 0.4, 'sawtooth', 0.05, 0, 50); break;
      case 'compute': T(220 + (p || 0) * 30, 0.08, 'square', 0.035); break;
      case 'roar': T(90, 0.9, 'sawtooth', 0.12, 0, 45); this.noise(0.9, 0.09, 0, 200, 0.3); break;
      case 'warp': T(200, 0.7, 'sine', 0.1, 0, 1600); break;

  music(theme) {

  },
  stopMusic() { if (this.timer) clearInterval(this.timer); this.timer = null; this.theme = null; },
  pump() {

    while (this.nextT < this.ctx.currentTime + 0.3) {
      const i = this.step, when = this.nextT - this.ctx.currentTime;
      const sc = th.scale, root = th.root;
      const f = (deg, oct) => root * Math.pow(2, (sc[((deg % sc.length) + sc.length) % sc.length] + 12 * (oct + Math.floor(deg / sc.length))) / 12);

      const r = this.rng();
      if (r < th.density) {
        const deg = prog + [0, 2, 4, 5, 7, 9][Math.floor(this.rng() * 6)];
        this.tone(f(deg, 1), beat * (r < th.density * 0.3 ? 3 : 1.4), th.lead || 'sine', 0.028, when, null, this.musG);
      }
      this.step++; this.nextT += beat;
    }
  }

// ===== save (browser storage; every access guarded) =====
const SV = {
  key: 'cacheblend-adventure-v1',
  d: null,
  fresh() {
    return { v: 1, st: {}, cr: {}, cleared: {}, sec: {}, opt: { sfx: 1, music: 1, q: 'auto', free: 0 }, last: '', intro: 0, done: 0, t: 0, miss: 0, seen: {}, gt: {} };
  },
  load() {
    let d = null;
    try { const raw = window.localStorage.getItem(this.key); if (raw) d = JSON.parse(raw); } catch (e) { d = null; }
    const f = this.fresh();
    if (!d || typeof d !== 'object' || d.v !== 1) d = f;
    for (const k in f) if (d[k] == null) d[k] = f[k];
    for (const k in f.opt) if (d.opt[k] == null) d.opt[k] = f.opt[k];
    this.d = d;
    return d;
  },
  save() {
    try { window.localStorage.setItem(this.key, JSON.stringify(this.d)); } catch (e) { /* storage unavailable: progress lasts for this visit only */ }
    bus.emit('saved');
  },
  reset() { const opt = this.d ? this.d.opt : null; this.d = this.fresh(); if (opt) this.d.opt = opt; this.save(); },
  stars(wid, sid) { return this.d.st[wid + '.' + sid] || 0; },
  isDone(wid, sid) { return !!this.d.st[wid + '.' + sid]; },
  setStation(wid, sid, stars) {
    const k = wid + '.' + sid;
    const first = !this.d.st[k];
    this.d.st[k] = Math.max(this.d.st[k] || 0, stars);
    this.save();
    return first;
  },
  crystals(wid) { return this.d.cr[wid] || (this.d.cr[wid] = []); },
  addCrystal(wid, id) { const a = this.crystals(wid); if (a.indexOf(id) < 0) { a.push(id); this.save(); return true; } return false; },
  totalStars() { let n = 0; for (const k in this.d.st) n += this.d.st[k]; return n; },
  totalCrystals() { let n = 0; for (const k in this.d.cr) n += this.d.cr[k].length; return n; },
  worldStars(wid) { let n = 0; for (const k in this.d.st) if (k.indexOf(wid + '.') === 0) n += this.d.st[k]; return n; }
};

      const key = opts.key || st.id;
      let pr = this.prog[key];
      if (!pr || pr.i >= st.steps.length) pr = this.prog[key] = { i: 0, miss: 0 };
      let result = { done: false };
      const dots = h('div.dots');
      const body = h('div.sheet-body.nb');
      const fb = h('div.fb', { hidden: true, 'aria-live': 'polite' });
      const links = h('div.foot-links');

      const foot = h('div.sheet-foot', fb, h('div.foot-row', links, primary));
      const head = h('div.sheet-head', h('h2', st.title, st.sub ? h('span.sub', st.sub) : null), dots);
      const sheet = h('div.sheet', { role: 'dialog', 'aria-label': st.title }, head, body, foot);

      };
      const finish = () => {
        const stars = pr.miss <= 1 ? 3 : pr.miss <= 4 ? 2 : 1;
        result = { done: true, stars, miss: pr.miss };
        delete this.prog[key];
        body.innerHTML = ''; fb.hidden = true; links.innerHTML = '';
        dots.innerHTML = '';
        const gains = (st.codex || []).map((id) => CODEX[id]).filter(Boolean);
        body.append(
          h('div.center',
            h('div.kicker', opts.kicker || '站點完成'),
            h('h3', st.title),
            h('div.stars', { html: [0, 1, 2].map((i) => this.starSvg(i < stars)).join('') }),
            h('p.note', stars === 3 ? '漂亮！幾乎沒有失誤。' : stars === 2 ? '不錯！重玩這一站可以挑戰三顆星。' : '完成了！之後可以回來重玩拿更多星星。')),
          gains.length ? h('div.gain', h('div.kicker', '寫進筆記本的新觀念'), gains.map((c) => h('div.card', h('b', c.t), c.en ? h('span.note', '　' + c.en) : null, h('div', { html: c.d })))) : null);
        setPrimary(opts.doneLabel || '收進筆記本', () => m.close());
        AU.sfx('star');
        NB.cur = { api: { solve: () => m.close() }, done: true, primary };
      };
      const show = () => {
        const i = pr.i, step = st.steps[i];
        body.innerHTML = ''; body.scrollTop = 0; fb.hidden = true; links.innerHTML = ''; primary.hidden = true;
        dots.innerHTML = '';
        st.steps.forEach((_, j) => dots.append(h('i' + (j < i ? '.done' : j === i ? '.cur' : ''))));
        let solved = false, stepMiss = 0, api = null;
        const next = () => { pr.i++; AU.sfx('page'); if (pr.i >= st.steps.length) finish(); else show(); };
        const refreshLinks = () => {
          links.innerHTML = '';
          if (solved) return;
          if (step.hint && stepMiss >= 1) links.append(h('button', { onclick: () => ctx.note('<b>提示：</b>' + step.hint, 'hint') }, '給我提示'));
          if (api && api.solve && stepMiss >= 3) links.append(h('button', { onclick: () => { pr.miss += 1; api.solve(); } }, '看解答'));
        };
        const ctx = {
          step, body, next,
          ok(html) {
            if (solved) return; solved = true; AU.sfx('ok');
            const msg = html != null ? html : step.after;
            fb.className = 'fb ok'; fb.innerHTML = '<b>答對了！</b>' + (msg ? ' ' + msg : ''); fb.hidden = false;
            links.innerHTML = '';
            setPrimary(i === st.steps.length - 1 ? '完成這一站' : '下一步', next);
            setTimeout(() => { try { fb.scrollIntoView({ block: 'nearest' }); } catch (e) { /* older engines */ } }, 30);
          },
          bad(html) {
            if (solved) return; stepMiss++; pr.miss++; AU.sfx('bad');
            fb.className = 'fb bad'; fb.innerHTML = html || '還不對，再想想。'; fb.hidden = false;
            refreshLinks();
          },
          note(html, kind) { fb.className = 'fb ' + (kind || 'hint'); fb.innerHTML = html; fb.hidden = false; },
          clearNote() { fb.hidden = true; },
          primary: setPrimary,
          isSolved: () => solved
        };
        const R = NB.R[step.t];
        if (!R) { body.append(h('p', '（缺少元件 ' + step.t + '）')); setPrimary('繼續', next); api = { solve: next }; }
        else api = R(body, step, ctx) || {};
        NB.cur = { api, ctx, step, st, isSolved: () => solved, next, primary, miss: () => pr.miss };
      };
      show();
    });
  }
};

function nbHead(body, step) {
  if (step.kicker) body.append(h('div.kicker', step.kicker));
  if (step.title) body.append(h('h3', { html: step.title }));
  if (step.pre) body.append(h('div', { html: step.pre }));
  if (step.fig) nbFig(body, step);
  if (step.q) body.append(h('p.q', { html: step.q }));
}
function nbFig(body, step) {
  const el = h('div.fig');
  body.append(el);
  const f = typeof step.fig === 'function' ? step.fig : FIG[step.fig];
  if (f) { try { f(el, step); } catch (e) { console.error(e); } }
  if (step.cap) body.append(h('div.cap', { html: step.cap }));
}
const joinMsg = (a, b) => (a ? a + ' ' : '') + (b || '');
function parseNum(s) {
  s = String(s).trim().replace(/[，,]/g, '').replace(/％|%/g, '').replace('／', '/');
  if (!s) return NaN;
  const fr = /^(-?\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)$/.exec(s);
  if (fr) return parseFloat(fr[1]) / parseFloat(fr[2]);
  if (!/^-?\d*\.?\d+$/.test(s)) return NaN;
  return parseFloat(s);
}

// ---- info ----
NB.R.info = (body, step, ctx) => {
  if (step.kicker) body.append(h('div.kicker', step.kicker));
  if (step.title) body.append(h('h3', { html: step.title }));
  if (step.html) body.append(h('div', { html: step.html }));
  if (step.fig) nbFig(body, step);
  if (step.html2) body.append(h('div', { html: step.html2 }));
  ctx.primary(step.btn || '繼續', ctx.next);
  return { solve: ctx.next };
};

// ---- choice: opts = [[text, ok(0/1), why]] ----
NB.R.choice = (body, step, ctx) => {
  nbHead(body, step);
  const opts = (step.fixed ? step.opts.slice() : shuffled(step.opts)).map((o) => ({ text: o[0], ok: !!o[1], why: o[2] }));
  const box = h('div.opts');
  body.append(box);
  const btns = opts.map((o, i) => { const b = h('button.opt-b', h('span.k', 'ABCDEF'[i]), h('span', { html: o.text })); box.append(b); return b; });
  let locked = false;
  if (!step.multi) {
    btns.forEach((b, i) => {
      b.onclick = () => {
        if (locked) return;
        if (opts[i].ok) {
          locked = true; b.classList.add('ok');
          btns.forEach((x, j) => { if (j !== i) x.disabled = true; });
          ctx.ok(joinMsg(opts[i].why, step.after));
        } else { b.classList.add('no', 'shake'); ctx.bad(opts[i].why || '這個選項不對，再想想。'); }
      };
    });
    return { solve() { const k = opts.findIndex((o) => o.ok); if (k >= 0) btns[k].click(); } };
  }
  const sel = new Set();
  btns.forEach((b, i) => { b.onclick = () => { if (locked) return; if (sel.has(i)) sel.delete(i); else sel.add(i); b.classList.toggle('sel', sel.has(i)); AU.sfx('tap'); }; });
  const check = () => {
    if (locked) return;
    const missing = opts.some((o, i) => o.ok && !sel.has(i));
    const extra = opts.findIndex((o, i) => !o.ok && sel.has(i));
    if (!missing && extra < 0) {
      locked = true;
      btns.forEach((b, i) => { b.classList.remove('sel'); if (opts[i].ok) b.classList.add('ok'); else b.disabled = true; });
      ctx.ok(step.after);
    } else if (extra >= 0) {
      btns[extra].classList.add('shake'); setTimeout(() => btns[extra].classList.remove('shake'), 600);
      ctx.bad(opts[extra].why || '有選到不該選的，再檢查一次。');
    } else ctx.bad('還有該選的沒選到（這題可以複選）。');
  };
  ctx.primary('檢查答案', check);
  return { solve() { btns.forEach((b, i) => { if (opts[i].ok !== sel.has(i)) b.click(); }); check(); } };
};

// ---- order: items listed in the correct order ----
NB.R.order = (body, step, ctx) => {
  nbHead(body, step);
  const n = step.items.length;
  const idx = shuffled(step.items.map((_, i) => i));
  if (n > 1 && idx.every((v, i) => v === i)) idx.reverse();
  const seq = [];
  const pool = h('div.pool'), out = h('div.seq');
  body.append(h('div.note', '點下面的卡片，依序排進虛線框；點框裡的卡片可以拿回來。'), out, pool);
  let locked = false;
  const chips = {};
  const draw = () => {
    out.innerHTML = '';
    if (!seq.length) out.append(h('div.seq-empty', '（依正確順序點選卡片）'));
    seq.forEach((id, pos) => {
      out.append(h('button.tok' + (locked ? '.ok' : ''), { onclick: () => { if (locked) return; seq.splice(pos, 1); AU.sfx('drop'); draw(); } }, h('span.n', String(pos + 1)), h('span', { html: step.items[id] })));
    });
    idx.forEach((id) => chips[id].classList.toggle('used', seq.indexOf(id) >= 0));
    ctx.primary('檢查順序', check, seq.length === n);
  };
  const check = () => {
    if (locked) return;
    const firstBad = seq.findIndex((id, pos) => id !== pos);
    if (firstBad < 0) { locked = true; draw(); ctx.ok(step.after); return; }
    Array.from(out.children).forEach((el, pos) => { if (pos >= firstBad) el.classList.add('no'); else el.classList.add('ok'); });
    ctx.bad(step.why || ('前 ' + firstBad + ' 個是對的；從第 ' + (firstBad + 1) + ' 個開始需要調整。'));
    setTimeout(() => { if (!locked) { seq.length = firstBad; draw(); } }, 900);
  };
  idx.forEach((id) => {
    chips[id] = h('button.tok', { html: step.items[id], onclick: () => { if (locked || seq.indexOf(id) >= 0) return; seq.push(id); AU.sfx('pick'); draw(); } });
    pool.append(chips[id]);
  });
  draw();
  return { solve() { if (locked) return; seq.length = 0; for (let i = 0; i < n; i++) seq.push(i); draw(); check(); } };
};

// ---- match: pairs = [[left, right]] ----
NB.R.match = (body, step, ctx) => {
  nbHead(body, step);
  const n = step.pairs.length;
  const rightOrder = shuffled(step.pairs.map((_, i) => i));
  const grid = h('div.match');
  body.append(h('div.note', '先點左邊，再點右邊配成一對。'), grid);
  const L = [], Rr = {};
  let pickL = -1, pickR = -1, done = 0;
  const tryPair = () => {
    if (pickL < 0 || pickR < 0) return;
    const l = pickL, r = pickR;
    pickL = pickR = -1;
    L[l].classList.remove('sel'); Rr[r].classList.remove('sel');
    const same = l === r || (step.pairs[l][1] === step.pairs[r][1]);
    if (same && !Rr[r].classList.contains('done')) {
      const c = TAGC[done % TAGC.length];
      [L[l], Rr[r]].forEach((el) => { el.classList.add('done'); el.style.borderColor = c; el.style.boxShadow = '0 3px 0 ' + c; el.prepend(h('span.tag', { style: { background: c } }, String(done + 1))); });
      done++; AU.sfx('pick');
      if (done === n) ctx.ok(step.after);
    } else {
      [L[l], Rr[r]].forEach((el) => { el.classList.add('shake'); setTimeout(() => el.classList.remove('shake'), 600); });
      ctx.bad(step.why || '這一對不合，再看看兩邊的描述。');
    }
  };
  for (let row = 0; row < n; row++) {
    const li = row, ri = rightOrder[row];
    const lb = h('button.tok', { html: step.pairs[li][0], onclick: () => { if (lb.classList.contains('done')) return; if (pickL >= 0) L[pickL].classList.remove('sel'); pickL = li; lb.classList.add('sel'); AU.sfx('tap'); tryPair(); } });
    const rb = h('button.tok', { html: step.pairs[ri][1], onclick: () => { if (rb.classList.contains('done')) return; if (pickR >= 0) Rr[pickR].classList.remove('sel'); pickR = ri; rb.classList.add('sel'); AU.sfx('tap'); tryPair(); } });
    L[li] = lb; Rr[ri] = rb;
    grid.append(lb, rb);
  }
  return { solve() { for (let i = 0; i < n; i++) { if (!L[i].classList.contains('done')) { L[i].click(); Rr[i].click(); } } } };
};

// ---- bucket: items = [[text, bucketIndex, why]] ----
NB.R.bucket = (body, step, ctx) => {
  nbHead(body, step);
  const items = shuffled(step.items);
  let i = 0;
  const card = h('div.card.bucket-card');
  const btns = h('div.buckets');
  const prog = h('div.bucket-prog');
  const doneList = h('div.bucket-done');
  body.append(card, btns, prog, doneList);
  const draw = () => {
    if (i >= items.length) { card.innerHTML = '全部分類完成'; btns.hidden = true; prog.textContent = ''; return; }
    card.innerHTML = items[i][0];
    prog.textContent = (i + 1) + ' / ' + items.length;
  };
  const choose = (b) => {
    if (i >= items.length) return;
    const it = items[i];
    if (it[1] === b) {
      doneList.prepend(h('div', h('b', { style: { color: TAGC[b % TAGC.length] } }, step.buckets[b].replace(/<[^>]+>/g, '')), h('span', { html: it[0] + (it[2] ? '<span class="note">　' + it[2] + '</span>' : '') })));
      i++; AU.sfx('pick'); ctx.clearNote(); draw();
      if (i >= items.length) ctx.ok(step.after);
    } else {
      card.classList.add('shake'); setTimeout(() => card.classList.remove('shake'), 600);
      ctx.bad(it[3] || it[2] || ('不是「' + step.buckets[b].replace(/<[^>]+>/g, '') + '」，再想想。'));
    }
  };
  step.buckets.forEach((name, b) => btns.append(h('button.btn', { html: name, onclick: () => choose(b) })));
  draw();
  return { solve() { let guard = 0; while (i < items.length && guard++ < 99) choose(items[i][1]); } };
};

// ---- fill: html with {0} {1}..., blanks = [{a, tol, alt}] ----
NB.R.fill = (body, step, ctx) => {
  nbHead(body, step);
  const html = step.html.replace(/\{(\d+)\}/g, (_, k) => '<input class="num" id="nb-in-' + k + '" data-i="' + k + '" inputmode="decimal" autocomplete="off" aria-label="第 ' + (Number(k) + 1) + ' 格">');
  const box = h('div.calc', { html });
  body.append(box);
  if (step.post) body.append(h('div', { html: step.post }));
  const ins = $$('input.num', box);
  let locked = false;
  const good = (inp) => {
    const b = step.blanks[Number(inp.dataset.i)];
    const v = parseNum(inp.value);
    if (isNaN(v)) return false;
    const tol = b.tol == null ? 0.011 : b.tol;
    if (Math.abs(v - b.a) <= tol) return true;
    return (b.alt || []).some((x) => Math.abs(v - x) <= tol);
  };
  const check = () => {
    if (locked) return;
    let all = true, empty = false;
    ins.forEach((inp) => { const ok = good(inp); if (!inp.value.trim()) empty = true; inp.classList.toggle('ok', ok); inp.classList.toggle('no', !ok && !!inp.value.trim()); if (!ok) all = false; });
    if (all) { locked = true; ins.forEach((inp) => { inp.readOnly = true; }); ctx.ok(step.after); }
    else if (empty) ctx.note('還有空格沒填。', 'hint');
    else ctx.bad(step.why || '標紅的格子再算一次。');
  };
  ins.forEach((inp) => inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); if (ctx.isSolved()) ctx.next(); else check(); } }));
  ctx.primary('檢查答案', check);
  return { solve() { ins.forEach((inp) => { inp.value = String(step.blanks[Number(inp.dataset.i)].a); }); check(); } };
};

// ---- grid: toggle cells; on(r,c) target; dis(r,c) fixed-off ----
NB.R.grid = (body, step, ctx) => {
  nbHead(body, step);
  const R = step.rows.length, C = step.cols.length;
  const wrap = h('div.tw');
  const g = h('div.cells', { style: { gridTemplateColumns: 'auto repeat(' + C + ', auto)' } });
  wrap.append(g); body.append(wrap);
  const state = [], cells = [];
  let locked = false;
  g.append(h('div.cell.hd', step.corner || ''));
  step.cols.forEach((c) => g.append(h('div.cell.hd', { html: c })));
  for (let r = 0; r < R; r++) {
    g.append(h('div.cell.hd', { html: step.rows[r] }));
    state.push([]); cells.push([]);
    for (let c = 0; c < C; c++) {
      const dis = step.dis && step.dis(r, c);
      const el = h('button.cell' + (dis ? '.off' : ''), { 'aria-label': '列 ' + (r + 1) + ' 欄 ' + (c + 1) });
      if (step.text) el.textContent = step.text(r, c) || '';
      state[r][c] = false; cells[r][c] = el;
      if (dis) el.disabled = true;
      else el.onclick = () => { if (locked) return; state[r][c] = !state[r][c]; el.classList.toggle('on', state[r][c]); el.classList.remove('bad', 'good'); AU.sfx('tap'); };
      g.append(el);
    }
  }
  if (step.post) body.append(h('div', { html: step.post }));
  const check = () => {
    if (locked) return;
    let wrong = 0;
    for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
      const want = !!step.on(r, c), el = cells[r][c];
      el.classList.remove('bad', 'good');
      if (state[r][c] !== want) { wrong++; if (state[r][c]) el.classList.add('bad'); }
    }
    if (!wrong) { locked = true; for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) if (state[r][c]) { cells[r][c].classList.remove('on'); cells[r][c].classList.add('good'); } ctx.ok(step.after); }
    else ctx.bad(step.why || ('還有 ' + wrong + ' 格不對（紅色是不該亮的；也可能有該亮的沒亮）。'));
  };
  ctx.primary('檢查', check);
  return { solve() { if (locked) return; for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) { const want = !!step.on(r, c); if (state[r][c] !== want && !cells[r][c].disabled) cells[r][c].click(); } check(); } };
};

// ---- pick: choose k of the items; correct = [indices] ----
NB.R.pick = (body, step, ctx) => {
  nbHead(body, step);
  const box = h('div.pool');
  body.append(box);
  const sel = new Set();
  let locked = false;
  const btns = step.items.map((it, i) => {
    const b = h('button.tok' + (it.c ? '.' + it.c : ''), { onclick: () => {
      if (locked) return;
      if (sel.has(i)) sel.delete(i); else { if (sel.size >= step.k) return; sel.add(i); }
      b.classList.toggle('sel', sel.has(i)); AU.sfx('tap');
      ctx.primary('確定（' + sel.size + '/' + step.k + '）', check, sel.size === step.k);
    } }, h('span', { html: it.t }), it.s ? h('span.n', it.s) : null);
    box.append(b); return b;
  });
  if (step.post) body.append(h('div', { html: step.post }));
  const check = () => {
    if (locked) return;
    const want = new Set(step.correct);
    const ok = sel.size === want.size && Array.from(sel).every((i) => want.has(i));
    if (ok) { locked = true; btns.forEach((b, i) => { b.classList.remove('sel'); if (want.has(i)) b.classList.add('ok'); }); ctx.ok(step.after); }
    else {
      Array.from(sel).forEach((i) => { if (!want.has(i)) { btns[i].classList.add('shake'); setTimeout(() => btns[i].classList.remove('shake'), 600); } });
      ctx.bad(step.why || '有幾個選得不對，再比較一下數值。');
    }
  };
  ctx.primary('確定（0/' + step.k + '）', check, false);
  return { solve() { if (locked) return; Array.from(sel).forEach((i) => btns[i].click()); step.correct.forEach((i) => btns[i].click()); check(); } };
};

// ---- 06-widgets-a.js ----
// ===== custom notebook widgets, part A (worlds 1-3) =====
const vecH = (arr, cls) => '<span class="vec ' + (cls || '') + '">' + arr.map((v) => '<i>' + v + '</i>').join('') + '</span>';
const matH = (rows) => '<span class="mat">' + rows.map((r) => '<span>' + r.map((v) => '<i>' + v + '</i>').join('') + '</span>').join('') + '</span>';

// cut a sentence into tokens by tapping the gaps
NB.R.cut = (body, step, ctx) => {
  nbHead(body, step);
  const chars = step.text.split('');
  const cuts = new Set();
  const row = h('div.cut-row');
  let locked = false;
  const gaps = [];
  chars.forEach((c, i) => {
    row.append(h('span.cut-ch', c));
    if (i < chars.length - 1) {
      const gp = h('button.cut-gap', { 'aria-label': '在「' + c + '」後面切一刀', onclick: () => { if (locked) return; if (cuts.has(i)) cuts.delete(i); else cuts.add(i); gp.classList.toggle('on', cuts.has(i)); AU.sfx('tap'); } });
      gaps[i] = gp; row.append(gp);
    }
  });
  const out = h('div.cut-out');
  body.append(row, h('div.note', '點兩個字中間的縫隙就能下刀，再點一次可以取消。'), out);
  const check = () => {
    if (locked) return;
    const want = new Set(step.cuts);
    const ok = cuts.size === want.size && Array.from(cuts).every((i) => want.has(i));
    if (!ok) { ctx.bad(cuts.size > want.size ? '切太碎了。有些字要合在一起才是一個 token。' : cuts.size < want.size ? '刀數還不夠，目標是 ' + (want.size + 1) + ' 個 token。' : '刀數對了，但位置不對。'); return; }
    locked = true;
    let s = 0;
    const toks = [];
    step.cuts.slice().sort((a, b) => a - b).concat([chars.length - 1]).forEach((e) => { toks.push(chars.slice(s, e + 1).join('')); s = e + 1; });
    toks.forEach((t, i) => out.append(h('span.tok.c' + (i % 3 + 1), h('span', t), h('span.n', 'ID ' + step.ids[i]))));
    ctx.ok(step.after);
  };
  ctx.primary('切好了', check);
  return { solve() { if (locked) return; gaps.forEach((gp, i) => { if (gp && cuts.has(i) !== (step.cuts.indexOf(i) >= 0)) gp.click(); }); check(); } };
};

// look up embedding vectors by token id
NB.R.lookup = (body, step, ctx) => {
  nbHead(body, step);
  let cur = 0;
  const seqEl = h('div.lk-seq'), tbl = h('div.lk-table');
  body.append(seqEl, h('div.note', '下面是嵌入表的一小角。點選「目前這個 token」的 ID 那一列。'), tbl);
  const slots = step.seq.map((s) => { const el = h('div.lk-slot', h('b', s.tok), h('span.mono', 'ID ' + s.id), h('div.lk-v', '？')); seqEl.append(el); return el; });
  const mark = () => slots.forEach((el, i) => el.classList.toggle('cur', i === cur));
  const rows = shuffled(step.table);
  const btns = rows.map((r) => {
    const b = h('button.lk-row', { onclick: () => {
      if (cur >= step.seq.length) return;
      if (r[0] === step.seq[cur].id) {
        $('.lk-v', slots[cur]).innerHTML = vecH(r[1], 'o');
        slots[cur].classList.add('ok'); cur++; AU.sfx('pick'); mark();

    } }, h('span.mono', 'ID ' + r[0]), h('span', { html: vecH(r[1]) }));
    tbl.append(b); return b;
  });
  mark();
  return { solve() { let guard = 0; while (cur < step.seq.length && guard++ < 20) { const k = rows.findIndex((r) => r[0] === step.seq[cur].id); btns[k].click(); } } };
};

// one vector through three learned matrices -> Q, K, V
NB.R.qkv = (body, step, ctx) => {
  nbHead(body, step);
  const defs = [
    { k: 'Q', cls: 'q', W: [[1, 0], [1, 1]], role: '我要找什麼' },
    { k: 'K', cls: 'k', W: [[0, 1], [1, 0]], role: '我能被怎麼比對' },
    { k: 'V', cls: 'v', W: [[2, 0], [1, 1]], role: '被參考時交出的內容' }
  ];
  const hv = [2, 1];
  const mul = (W) => [hv[0] * W[0][0] + hv[1] * W[1][0], hv[0] * W[0][1] + hv[1] * W[1][1]];
  const done = new Set();
  const grid = h('div.qkv-grid');
  body.append(h('p', { html: '同一個輸入 <b>h</b> = ' + vecH(hv) + '，分別送進三台機器。點每一台看看結果（省略了偏置、正規化與位置處理）。' }), grid);
  const btns = defs.map((d) => {
    const out = h('div.qkv-out', '？');
    const b = h('button.qkv-m.' + d.cls, { onclick: () => {
      const r = mul(d.W);
      out.innerHTML = d.k + ' = ' + vecH(r, d.cls);
      done.add(d.k); AU.sfx('compute', done.size);
      b.classList.add('on');
      if (done.size === 3) ctx.ok(step.after);
    } }, h('div.qkv-name', 'W', h('sub', d.k)), h('div', { html: matH(d.W) }), h('div.note', d.role), out);
    grid.append(b); return b;
  });
  return { solve() { btns.forEach((b) => b.click()); } };
};

// KV cache size calculator
NB.R.kvsize = (body, step, ctx) => {
  nbHead(body, step);
  const P = { L: 32, H: 32, d: 128, b: 2, T: 4096 };
  const defs = [
    { k: 'L', name: '層數 L', vals: [12, 24, 32, 48, 80] },
    { k: 'H', name: 'KV head 數 H<sub>kv</sub>', vals: [4, 8, 16, 32] },
    { k: 'd', name: '每頭維度 d<sub>head</sub>', vals: [64, 128] },
    { k: 'b', name: '每個數值的位元組 b', vals: [1, 2, 4] },
    { k: 'T', name: 'token 數 T', vals: [512, 1024, 4096, 8192] }
  ];
  const out = h('div.card');
  const human = (x) => (x >= 1073741824 ? (x / 1073741824).toFixed(2).replace(/\.?0+$/, '') + ' GiB' : x >= 1048576 ? (x / 1048576).toFixed(1).replace(/\.0$/, '') + ' MiB' : (x / 1024).toFixed(0) + ' KiB');
  let stage = 0, locked = false;
  const goalEl = h('p.q');
  body.append(h('p', { html: '容量 ≈ <code>2 × B × L × T × H<sub>kv</sub> × d<sub>head</sub> × b</code>（前面的 2 是 K、V 各一份；這裡 B = 1）' }));
  const segs = {};
  defs.forEach((d) => {
    const seg = h('div.seg');
    d.vals.forEach((v) => seg.append(h('button' + (P[d.k] === v ? '.on' : ''), { onclick: () => { if (locked) return; P[d.k] = v; $$('button', seg).forEach((x) => x.classList.toggle('on', x.textContent === String(v))); AU.sfx('tap'); draw(); } }, String(v))));
    segs[d.k] = seg;
    body.append(h('div.kv-row', h('label', { html: d.name }), seg));
  });
  body.append(out, goalEl);
  const perTok = () => 2 * P.L * P.H * P.d * P.b;
  const draw = () => {
    out.innerHTML = '<div class="kicker">每個 token 跨所有層的 KV</div><div class="readout">' + perTok().toLocaleString('en-US') + ' bytes = ' + human(perTok()) + '</div><div class="kicker" style="margin-top:6px">' + P.T + ' 個 token 的 KV Cache</div><div class="readout">' + human(perTok() * P.T) + '</div>';
  };
  const goals = step.goals;
  const showGoal = () => { goalEl.innerHTML = '任務 ' + (stage + 1) + '／' + goals.length + '：' + goals[stage].q; };
  const check = () => {
    if (locked) return;
    const g = goals[stage];
    if (g.test(P, perTok())) {
      stage++;
      if (stage >= goals.length) { locked = true; ctx.ok(step.after); }
      else { AU.sfx('pick'); ctx.note('<b>達成！</b> ' + g.ok, 'ok'); showGoal(); }
    } else ctx.bad(g.bad || '還沒達到這個任務的條件，再調調看。');
  };
  ctx.primary('確認', check);
  draw(); showGoal();
  return { solve() { let guard = 0; while (!locked && guard++ < 9) { const g = goals[stage]; Object.assign(P, g.set); defs.forEach((d) => $$('button', segs[d.k]).forEach((x) => x.classList.toggle('on', x.textContent === String(P[d.k])))); draw(); check(); } } };
};

// ---- 07-engine.js ----
// ===== 3D engine: renderer, player, camera, input, collisions =====
const PH = { speed: 6.4, accel: 13, g: 30, jump: 10.6, r: 0.42, height: 1.5, step: 0.58, guard: 0.8 };
const E = {
  ok: false, running: false, mode: 'idle', t: 0, quality: 'high',
  level: null, tweens: [], auto: null, focusT: 0, focusPos: null, lockInput: false,
  keys: {}, stick: { x: 0, y: 0, on: false }, jumpQ: false,
  camYaw: 0, camPitch: 0.74, camDist: 13.5, yawOff: 0, pitchOff: 0,
  p: null,

  init(canvas) {
    if (!window.THREE) return false;
    try {
      this.canvas = canvas;
      const r = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
      this.renderer = r;
      r.shadowMap.type = THREE.PCFSoftShadowMap;
      this.scene = new THREE.Scene();
      this.cam = new THREE.PerspectiveCamera(48, 1, 0.3, 400);
      this.camTarget = new THREE.Vector3();
      this.hemi = new THREE.HemisphereLight(0xffffff, 0x445577, 0.85);
      this.sun = new THREE.DirectionalLight(0xffffff, 0.75);
      this.sun.castShadow = true;
      this.sun.shadow.mapSize.set(1024, 1024);
      const sc = this.sun.shadow.camera;
      sc.left = -24; sc.right = 24; sc.top = 24; sc.bottom = -24; sc.near = 1; sc.far = 90;
      this.sun.shadow.bias = -0.0012;
      this.scene.add(this.hemi, this.sun, this.sun.target);
      this.ray = new THREE.Raycaster();
      this.p = { pos: new THREE.Vector3(), vel: new THREE.Vector3(), yaw: 0, grounded: true, groundCol: null, air: 0, coy: 0, safe: new THREE.Vector3(), safeT: 0, moveAmt: 0, squash: 0, model: null, carry: null };
      this.fxInit();
      this.bindInput();
      this.setQuality(SV.d.opt.q || 'auto');
      this.resize();
      window.addEventListener('resize', () => this.resize());
      if (window.ResizeObserver) new ResizeObserver(() => this.resize()).observe(canvas.parentElement);
      this.ok = true;
      return true;
    } catch (e) {
      console.warn('WebGL init failed', e);
      this.ok = false;
      return false;
    }
  },

  setQuality(q) {
    if (!this.renderer) return;
    this.qPref = q;
    const coarse = isCoarse();
    const eff = q === 'auto' ? (coarse ? 'mid' : 'high') : q;
    this.quality = eff;
    const dpr = window.devicePixelRatio || 1;
    this.renderer.setPixelRatio(eff === 'low' ? 1 : Math.min(dpr, eff === 'mid' ? 1.5 : 2));
    this.renderer.shadowMap.enabled = eff !== 'low';
    this.sun.castShadow = eff !== 'low';
    this.scene.traverse((o) => { if (o.material) { (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => { m.needsUpdate = true; }); } });
    this.resize();
  },

  resize() {
    if (!this.renderer) return;
    const w = Math.max(1, this.canvas.parentElement.clientWidth), hgt = Math.max(1, this.canvas.parentElement.clientHeight);
    this.renderer.setSize(w, hgt, false);
    this.cam.aspect = w / hgt;
    this.portrait = w < hgt;
    this.cam.fov = this.portrait ? 58 : 48;
    this.cam.updateProjectionMatrix();
  },

  // ---------- input ----------
  bindInput() {
    const c = this.canvas;
    window.addEventListener('keydown', (e) => {
      if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
      const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].indexOf(k) >= 0) e.preventDefault();
      if (!this.keys[k]) bus.emit('key', k, e);
      this.keys[k] = true;
      if (k === ' ' && !UI.blocking()) this.jumpQ = true;
    });
    window.addEventListener('keyup', (e) => { const k = e.key.length === 1 ? e.key.toLowerCase() : e.key; this.keys[k] = false; });
    window.addEventListener('blur', () => { this.keys = {}; this.stick.on = false; this.stick.x = this.stick.y = 0; });

    // virtual stick
    const st = $('#stick'), knob = $('#stick-knob');
    let sid = null;
    const setStick = (e) => {
      const r = st.getBoundingClientRect();
      let dx = (e.clientX - (r.left + r.width / 2)) / (r.width / 2), dy = (e.clientY - (r.top + r.height / 2)) / (r.height / 2);
      const len = Math.hypot(dx, dy);
      if (len > 1) { dx /= len; dy /= len; }
      this.stick.x = dx; this.stick.y = dy; this.stick.on = true;
      knob.style.transform = 'translate(' + dx * r.width * 0.3 + 'px,' + dy * r.height * 0.3 + 'px)';
    };
    const endStick = () => { sid = null; this.stick.on = false; this.stick.x = this.stick.y = 0; knob.style.transform = ''; };
    st.addEventListener('pointerdown', (e) => { e.preventDefault(); AU.init(); sid = e.pointerId; try { st.setPointerCapture(sid); } catch (er) { /* no capture */ } setStick(e); });
    st.addEventListener('pointermove', (e) => { if (e.pointerId === sid) setStick(e); });
    st.addEventListener('pointerup', (e) => { if (e.pointerId === sid) endStick(); });
    st.addEventListener('pointercancel', endStick);
    $('#btn-jump').addEventListener('pointerdown', (e) => { e.preventDefault(); AU.init(); if (!UI.blocking()) this.jumpQ = true; });

    // canvas: tap to walk, drag to look around, wheel to zoom
    let drag = null;
    c.addEventListener('pointerdown', (e) => {
      AU.init();
      drag = { id: e.pointerId, x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, t: performance.now(), moved: false };
      try { c.setPointerCapture(e.pointerId); } catch (er) { /* no capture */ }
    });
    c.addEventListener('pointermove', (e) => {
      if (!drag || drag.id !== e.pointerId) return;
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 9) drag.moved = true;
      if (drag.moved && this.mode === 'play') {
        this.yawOff = clamp(this.yawOff - dx * 0.006, -1.5, 1.5);
        this.pitchOff = clamp(this.pitchOff + dy * 0.004, -0.4, 0.4);
        this.lookT = this.t;
      }
      drag.x = e.clientX; drag.y = e.clientY;
    });
    const up = (e) => {
      if (!drag || drag.id !== e.pointerId) return;
      const d = drag; drag = null;
      if (!d.moved && performance.now() - d.t < 400) this.tap(e.clientX, e.clientY);
    };
    c.addEventListener('pointerup', up);
    c.addEventListener('pointercancel', () => { drag = null; });
    c.addEventListener('wheel', (e) => { e.preventDefault(); this.camDist = clamp(this.camDist + e.deltaY * 0.01, 8, 22); }, { passive: false });
    c.addEventListener('contextmenu', (e) => e.preventDefault());
  },

  tap(cx, cy) {
    if (this.mode !== 'play' || UI.blocking() || this.lockInput || !this.level) return;
    const r = this.canvas.getBoundingClientRect();
    const v = new THREE.Vector2(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
    this.ray.setFromCamera(v, this.cam);
    const hits = this.ray.intersectObjects(this.level.pick, false);
    if (!hits.length) return;
    const pt = hits[0].point;
    let near = null, nd = 2.2;
    this.level.inter.forEach((it) => { if (it.enabled === false) return; const d = Math.hypot(it.x - pt.x, it.z - pt.z); if (d < nd) { nd = d; near = it; } });
    this.auto = { x: near ? near.x : pt.x, z: near ? near.z : pt.z, inter: near, stuck: 0, last: this.p.pos.clone() };
    if (this.level.tapRing) { this.level.tapRing.position.set(this.auto.x, pt.y + 0.06, this.auto.z); this.level.tapRing.visible = true; this.level.tapRing.userData.t = 0; }
  },

  // ---------- level plumbing ----------
  setLevel(lv) {
    this.clearLevel();
    this.level = lv;
    this.scene.add(lv.group);
    const th = lv.theme;
    this.scene.background = lv.skyTex;
    this.scene.fog = new THREE.Fog(th.fog, th.fogNear || 34, th.fogFar || 95);
    this.hemi.color.setHex(th.hemiSky); this.hemi.groundColor.setHex(th.hemiGround); this.hemi.intensity = th.hemiI == null ? 0.62 : th.hemiI;
    this.sun.color.setHex(th.sun); this.sun.intensity = th.sunI == null ? 0.5 : th.sunI;
    this.sunDir = new THREE.Vector3(th.sunDir[0], th.sunDir[1], th.sunDir[2]).normalize();
    this.camYaw = lv.cam.yaw || 0; this.camPitch = lv.cam.pitch || 0.74; this.camDist = lv.cam.dist || 13.5;
    this.yawOff = 0; this.pitchOff = 0;
    const s = lv.spawn;
    this.teleport(s.x, s.y, s.z);
    this.p.yaw = Math.PI;
    if (this.p.model) { if (!this.p.model.parent) this.scene.add(this.p.model); this.p.model.visible = lv.showPlayer !== false; }
    if (this.kv) { if (!this.kv.parent) this.scene.add(this.kv); this.kv.visible = lv.showPlayer !== false; this.kv.position.set(s.x + 1, s.y + 2, s.z); }
    if (this.blob) this.blob.visible = lv.showPlayer !== false;
    this.snapCam();
  },
  clearLevel() {
    const lv = this.level;
    if (!lv) return;
    this.scene.remove(lv.group);
    lv.group.traverse((o) => {
      if (o.userData && o.userData.own) {
        if (o.geometry) o.geometry.dispose();
        if (o.material) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); }
      }
    });
    if (lv.skyTex) lv.skyTex.dispose();
    this.level = null; this.auto = null; this.tweens.length = 0; this.focusPos = null; this.lockInput = false;
    if (this.p) this.p.carry = null;
    UI.setPrompt(null); UI.actHud(null);
  },
  teleport(x, y, z) {
    const p = this.p;
    p.pos.set(x, y, z); p.vel.set(0, 0, 0); p.grounded = true; p.groundCol = null; p.safe.set(x, y, z); p.air = 0;
    this.auto = null;
  },
  snapCam() {
    const p = this.p;
    this.camTarget.set(p.pos.x, p.pos.y + 1.3 + ((this.level && this.level.camLift) || 0), p.pos.z);
    this.placeCam(1);
  },

  }
};

    const cx = (b.x0 + b.x1) / 2, cz = (b.z0 + b.z1) / 2, span = Math.max(b.x1 - b.x0, b.z1 - b.z0) + 70;
    const sea = new THREE.Mesh(G('plane'), M(th.cloud, { basic: true, opacity: 0.55 }));
    sea.rotation.x = -Math.PI / 2; sea.scale.set(span * 3, span * 3, 1); sea.position.set(cx, lv.killY + 3, cz); lv.group.add(sea);
    const rng = mulberry((o.seed || 5) * 977);
    for (let i = 0; i < (o.clouds == null ? 9 : o.clouds); i++) this.cloud(cx + (rng() - 0.5) * span * 1.3, -7 + rng() * 5 + (i % 3 === 0 ? 22 : 0), cz + (rng() - 0.5) * span * 1.3 - 10, 1.6 + rng() * 2.2);
    // drifting token cubes in the paper's three chunk colours
    const bits = [];
    const cc = [COL.blue, COL.orange, COL.green, COL.paper];
    for (let i = 0; i < (o.bits == null ? 26 : o.bits); i++) {
      const m = mesh('box', cc[i % 4], { opacity: 0.85 });
      const s = 0.25 + rng() * 0.4; m.scale.setScalar(s);
      m.position.set(cx + (rng() - 0.5) * span, 3 + rng() * 16, cz + (rng() - 0.5) * span);
      lv.group.add(m); bits.push({ m, y: m.position.y, ph: rng() * 9, sp: 0.3 + rng() * 0.6 });
    }
    lv.anims.push((dt, t) => { for (let i = 0; i < bits.length; i++) { const q = bits[i]; q.m.rotation.x = t * q.sp; q.m.rotation.y = t * q.sp * 0.7; q.m.position.y = q.y + Math.sin(t * q.sp + q.ph) * 0.8; } });
    // motes
    const N = 140, pos = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) { pos[i * 3] = cx + (rng() - 0.5) * span * 0.8; pos[i * 3 + 1] = rng() * 14; pos[i * 3 + 2] = cz + (rng() - 0.5) * span * 0.8; }
    const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const pts = new THREE.Points(geo, new THREE.PointsMaterial({ color: th.mote, size: 0.14, transparent: true, opacity: 0.75, depthWrite: false }));
    pts.userData.own = true; pts.userData.ownGeo = true; lv.group.add(pts);
    lv.anims.push((dt, t) => { pts.position.y = Math.sin(t * 0.3) * 0.6; pts.rotation.y = Math.sin(t * 0.05) * 0.05; });
  },

  // ---------- path layout helper ----------
  path(x, z, y, heading) {
    const self = this;
    const D = { F: [0, -1], L: [-1, 0], R: [1, 0], B: [0, 1] };
    const P = { x, z, y: y || 0, h: heading || 'F', last: null };
    P.island = (w, d, o) => {
      const v = D[P.h];
      const ex = v[0] !== 0 ? d : w, ez = v[0] !== 0 ? w : d;
      const cx = P.x + v[0] * ex / 2, cz = P.z + v[1] * ez / 2;
      const r = self.island(cx, cz, ex, ez, P.y, o);
      r.enter = { x: P.x, z: P.z, h: P.h };
      self.lv.route.push({ x: cx, z: cz, y: P.y, w: ex, d: ez, island: true });
      P.x += v[0] * ex; P.z += v[1] * ez; P.last = r;
      return r;
    };
    P.exit = (dir, off) => {
      const r = P.last, v = D[dir]; off = off || 0;
      P.h = dir;
      P.x = r.x + v[0] * r.w / 2 + (v[0] === 0 ? off : 0);
      P.z = r.z + v[1] * r.d / 2 + (v[1] === 0 ? off : 0);
      self.lv.route.push({ x: P.x - v[0] * 1.2, z: P.z - v[1] * 1.2, y: P.y });
      return P;
    };
    P.bridge = (len, w, o) => {
      const v = D[P.h];
      const nx = P.x + v[0] * len, nz = P.z + v[1] * len;
      const br = self.bridge(P.x, P.z, nx, nz, P.y, w || 2.8, o);
      P.x = nx; P.z = nz;
      self.lv.route.push({ x: nx - v[0] * 0.6, z: nz - v[1] * 0.6, y: P.y });
      return br;
    };
    P.gate = (o) => {
      const v = D[P.h];
      return self.gate(P.x + v[0] * 0.5, P.z + v[1] * 0.5, P.y, Object.assign({ axis: v[0] !== 0 ? 'z' : 'x', w: 2.8 }, o || {}));
    };
    P.stones = (n, gap, size, rise) => {
      const v = D[P.h], out = []; gap = gap || 1.3; size = size || 1.9; rise = rise || 0;
      for (let i = 0; i < n; i++) {
        P.y += rise;
        const cx = P.x + v[0] * (gap + size / 2), cz = P.z + v[1] * (gap + size / 2);
        out.push(self.stone(cx, cz, P.y, size));
        self.lv.route.push({ x: cx, z: cz, y: P.y });
        P.x += v[0] * (gap + size); P.z += v[1] * (gap + size);
      }
      P.x += v[0] * gap; P.z += v[1] * gap;
      return out;
    };
    P.stairs = (n, rise, w) => {
      const v = D[P.h]; rise = rise == null ? 0.45 : rise; w = w || 3;
      const th = self.lv.theme;
      for (let i = 0; i < n; i++) {
        P.y += rise;
        const cx = P.x + v[0] * 0.5, cz = P.z + v[1] * 0.5;
        const bw = v[0] !== 0 ? 1 : w, bd = v[0] !== 0 ? w : 1;
        self.box(cx, P.y - 0.6, cz, bw, 1.2, bd, i % 2 ? th.trim : th.top, { pick: true });
        self.col(cx - bw / 2, cx + bw / 2, P.y - 1.2, P.y, cz - bd / 2, cz + bd / 2, { solid: true });
        self.grow(cx, cz, bw, bd);
        P.x += v[0]; P.z += v[1];
      }
      self.lv.route.push({ x: P.x - v[0] * 0.4, z: P.z - v[1] * 0.4, y: P.y });
    };
    P.gap = (len, o) => { const v = D[P.h]; P.x += v[0] * len; P.z += v[1] * len; self.lv.route.push(Object.assign({ x: P.x + v[0] * 0.8, z: P.z + v[1] * 0.8, y: P.y, nojump: true }, o || {})); };
    return P;
  }
};

// ===== in-world 3D activities =====
const ACT = {};

// floating cube with a caption, used for tokens and chunks
function tokenCube(text, sub, color, size) {
  const g = new THREE.Group();
  const s = size || 0.8;
  const m = mesh('box', color); m.scale.setScalar(s); m.castShadow = true; g.add(m);
  const e = mesh('box', COL.ink, { basic: true, opacity: 0.18 }); e.scale.setScalar(s * 1.08); g.add(e);
  const t = textTex(text, { px: 34, bg: null, color: '#1b2340' });
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: t.tex, transparent: true, depthWrite: false }));
  sp.scale.set(0.72 * t.aspect, 0.72, 1); t.onRedraw = (a) => sp.scale.set(0.72 * a, 0.72, 1);
  sp.position.y = s * 0.5 + 0.55; sp.userData.own = true; g.add(sp);
  if (sub) {
    const t2 = textTex(sub, { px: 22, font: 'mono', bg: '#1b2340', color: '#f4f6fb', border: null, pad: 6, radius: 8 });
    const sp2 = new THREE.Sprite(new THREE.SpriteMaterial({ map: t2.tex, transparent: true, depthWrite: false }));
    sp2.scale.set(0.42 * t2.aspect, 0.42, 1); t2.onRedraw = (a) => sp2.scale.set(0.42 * a, 0.42, 1);
    sp2.position.y = -s * 0.5 - 0.3; sp2.userData.own = true; g.add(sp2);
  }
  g.userData.box = m;
  return g;
}

// W1: collect the token cubes that hop out of the tokenizer
ACT.cubes = (ctx, o) => {
  const lv = ctx.lv;
  const cc = [COL.blue, COL.orange, COL.green, COL.gold];
  let active = false, got = 0;
  const items = o.items.map((it, i) => {
    const g = tokenCube(it.text, 'ID ' + it.id, cc[i % 4]);
    g.position.set(it.x, it.y, it.z); g.visible = false; lv.group.add(g);
    return { g, it, got: false, ph: i * 1.3 };
  });
  const hud = () => UI.actHud('收集托克切好的 <b>詞元方塊</b>　<span class="big">' + got + ' / ' + items.length + '</span>');
  const nextAnchor = () => { const n = items.find((q) => !q.got); if (n) ctx.anchor(o.id, n.it.x, n.it.z, n.it.y - 1); };
  const reveal = (quiet) => {
    active = true;
    items.forEach((q, i) => {
      q.g.visible = true;
      if (!quiet) { q.g.scale.setScalar(0.01); E.tween(0.5 + i * 0.12, (k) => q.g.scale.setScalar(easeOut(k))); E.fx.burst(q.it.x, q.it.y, q.it.z, cc[i % 4], 14, 3, 0.8); }
    });
    nextAnchor();
  };
  if (ctx.done(o.id)) return;
  if (ctx.done(o.after)) reveal(true); else ctx.onDone(o.after, () => { reveal(false); UI.say([['kv', '看！切好的 token 跳出來了。每一塊上面是文字，下面是它的 <b>token ID</b>。'], ['kv', '把四塊都收集起來。最後一塊在木箱上，要<b>跳</b>上去喔。']]); });
  lv.updates.push((dt, t) => {
    if (!active) return;
    const p = E.p.pos;
    let near = false;
    items.forEach((q) => {
      if (q.got) return;
      q.g.rotation.y = t * 1.2 + q.ph; q.g.position.y = q.it.y + Math.sin(t * 2.2 + q.ph) * 0.12;
      const dx = q.it.x - p.x, dy = q.it.y - (p.y + 0.8), dz = q.it.z - p.z;
      if (dx * dx + dz * dz < 144) near = true;
      if (dx * dx + dy * dy + dz * dz < 1.5) {
        q.got = true; q.g.visible = false; got++;
        AU.sfx('coin', got); E.fx.burst(q.it.x, q.it.y, q.it.z, COL.gold, 22, 4, 0.8);
        UI.toast('拿到「' + q.it.text + '」　token ID ' + q.it.id, 'good', 1600);
        nextAnchor();
        if (got === items.length) { active = false; UI.actHud(null); ctx.complete(o.id, 3); UI.say([['kv', '四個 token 到手：15、82、36、91。這些編號只是<b>索引</b>，還不能拿來算。'], ['kv', '下一步，拿它們去<b>嵌入表</b>換成向量！']]); }
      }
    });
    if (active) { if (near) hud(); else UI.actHud(null); }
  });
};

// ===== activities for worlds 2-3 =====
function ownMat(color, o) {
  const m = new THREE.MeshLambertMaterial(Object.assign({ color }, o || {}));
  return m;
}
function ownBox(x, y, z, w, hgt, d, color, geoName, o) {
  const m = new THREE.Mesh(G(geoName || 'box'), ownMat(color, o));
  m.position.set(x, y, z); m.scale.set(w, hgt, d); m.receiveShadow = true; m.userData.own = true;
  B.lv.group.add(m);
  return m;
}
// a small pedestal you can press E at
function button3d(x, z, y, label, color) {
  B.box(x, y + 0.45, z, 0.7, 0.9, 0.7, COL.ink, { geo: 'cyl' });
  const orb = B.box(x, y + 1.15, z, 0.36, 0.36, 0.36, color || COL.gold, { geo: 'sph', basic: true, cast: false });
  B.label(label, x, y + 2.0, z, { h: 0.5, px: 24 });

  return orb;
}

// W2: jump on floor tiles to light the causal mask
ACT.floor = (ctx, o) => {
  const lv = ctx.lv, n = o.toks.length, S = 2.0, P2 = 2.2, y = o.y || 0;
  const OFF = 0xcfc3a0, ON = COL.gold, BAD = COL.rose, GOOD = COL.green;
  const tiles = [];
  let fails = 0, solved = ctx.done(o.id), flash = 0;
  const tx = (c) => o.cx + (c - (n - 1) / 2) * P2, tz = (r) => o.cz + (r - (n - 1) / 2) * P2;
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    const m = ownBox(tx(c), y + 0.1, tz(r), S, 0.2, S, OFF);
    lv.pick.push(m);
    const col = B.col(tx(c) - S / 2, tx(c) + S / 2, y - 0.3, y + 0.2, tz(r) - S / 2, tz(r) + S / 2, { solid: true });
    const t = { r, c, m, col, on: false };
    col.tile = t; tiles.push(t);
  }
  o.toks.forEach((tk, i) => {
    B.decal('Q ' + tk, o.cx - (n / 2) * P2 - 1.5, y, tz(i), { h: 0.72, color: '#3d4a8f' });
    B.decal('K ' + tk, tx(i), y, o.cz - (n / 2) * P2 - 0.8, { h: 0.66, color: '#b0561a' });
  });
  B.decal('每一列是發問的 Q，每一欄是被參考的 K', o.cx, y, o.cz + (n / 2) * P2 + 0.9, { h: 0.5, color: '#5a4a3a', font: 'body' });
  const paint = () => tiles.forEach((t) => t.m.material.color.setHex(solved ? (t.c <= t.r ? GOOD : OFF) : t.bad ? BAD : t.on ? ON : OFF));
  if (solved) tiles.forEach((t) => { t.on = t.c <= t.r; });
  paint();
  const lit = () => tiles.filter((t) => t.on).length;
  lv.onLand.push((g) => {
    if (solved || !g.tile) return;
    const t = g.tile; t.on = !t.on; t.bad = false; paint();
    AU.sfx(t.on ? 'pick' : 'drop'); E.fx.burst(t.m.position.x, y + 0.4, t.m.position.z, t.on ? ON : 0xffffff, 12, 2.5, 0.5);
  });
  const win = (stars) => {
    solved = true; paint(); AU.sfx('open');
    tiles.forEach((t) => { if (t.c <= t.r) E.fx.burst(t.m.position.x, y + 0.5, t.m.position.z, GOOD, 8, 3, 0.9); });
    UI.actHud(null);
    ctx.complete(o.id, stars);
    UI.say([['att', '這就是<b>因果遮罩</b>。每個 token 只能參考自己和前面的 token，所以亮起來的是<b>下三角</b>，對角線也算。'], ['kv', '注意！因為後面的 token 看不到、也改不了前面的計算，前面算好的 K、V 才可以<b>留下來重用</b>。']]);
  };
  const check = () => {
    const wrong = tiles.filter((t) => t.on !== (t.c <= t.r));
    if (!wrong.length) { win(fails === 0 ? 3 : fails <= 2 ? 2 : 1); return; }
    fails++; AU.sfx('bad');
    wrong.forEach((t) => { if (t.on) t.bad = true; });
    paint(); flash = 1.4;
    const miss = wrong.filter((t) => !t.on).length, extra = wrong.filter((t) => t.on).length;
    UI.toast((extra ? '紅色的 ' + extra + ' 格不該亮（那是「未來」的 token）。' : '') + (miss ? '還有 ' + miss + ' 格該亮沒亮。' : ''), 'bad', 3200);
    if (fails === 2) UI.say([['kv', '提示：站在某一列，問自己「這個 Q 能看到哪些 K？」答案是<b>自己，和排在它前面的所有 token</b>。']]);
  };
  const demo = () => { tiles.forEach((t) => { t.on = t.c <= t.r; t.bad = false; }); win(1); };
  button3d(o.check.x, o.check.z, y, '檢查遮罩');
  lv.inter.push({ x: o.check.x, y, z: o.check.z, r: 2.2, acts: () => (solved ? null : fails >= 2 ? [{ label: '檢查遮罩', fn: check }, { label: '請凱薇示範', fn: demo }] : [{ label: '檢查遮罩', fn: check }]) });
  ctx.anchor(o.id, o.check.x, o.check.z, y);
  lv.updates.push((dt) => {
    if (flash > 0) { flash -= dt; if (flash <= 0) { tiles.forEach((t) => { if (t.bad) { t.bad = false; t.on = false; } }); paint(); } }
    if (solved) return;
    const p = E.p.pos, near = Math.abs(p.x - o.cx) < n * P2 / 2 + 4.5 && Math.abs(p.z - o.cz) < n * P2 / 2 + 4.5;
    if (near) UI.actHud('站到地磚上<b>原地跳一下</b>，點亮「這個 Q 可以參考的 K」。完成後到金色按鈕檢查。<div class="row"><span class="pill">已點亮 ' + lit() + ' 格</span></div>');
    else UI.actHud(null);
  });
  lv.debug = lv.debug || {};
  lv.debug[o.id] = { tiles, check, target: (t) => t.c <= t.r };
};

// W3: generate three tokens without and then with a KV cache
ACT.run = (ctx, o) => {
  const lv = ctx.lv, y = o.y || 0, names = ['x₁', 'x₂', 'x₃', 'y₁', 'y₂', 'y₃'];
  const DARK = 0x3a4470, LIT = COL.gold, CACHED = COL.cyan, NEXT = 0xffffff;
  let phase = ctx.done(o.id) ? 'done' : 'A', round = 0, expect = 0, count = 0, busy = false;
  const pads = names.map((nm, i) => {
    const z = o.z0 - i * o.dz;
    const m = ownBox(o.x, y + 0.09, z, 1.15, 0.18, 1.15, DARK, 'cyl');
    B.decal(nm, o.x + 2.1, y, z, { h: 0.95, color: i < 3 ? '#8fb4ff' : '#ffc08a', font: 'mono' });
    const cry = B.box(o.x, y + 1.5, z, 0.34, 0.5, 0.34, CACHED, { geo: 'oct', phong: true, flat: true, emissive: 0x1f5f8f, cast: false });
    cry.visible = false;
    return { i, z, m, cry, lit: false, cached: false, shown: i < 3 };
  });
  const paint = () => pads.forEach((p) => {
    p.m.visible = p.shown; p.cry.visible = p.cached && p.shown;
    p.m.material.color.setHex(p.cached ? CACHED : p.lit ? LIT : DARK);
    p.m.material.emissive.setHex(p.cached ? 0x1f5f8f : p.lit ? 0x6a4a00 : 0x000000);
  });
  const need = () => (phase === 'A' ? 3 + round : round === 0 ? 3 : 1);
  const firstIdx = () => (phase === 'B' && round > 0 ? 2 + round : 0);
  if (phase === 'done') pads.forEach((p) => { p.shown = true; p.cached = p.i < 5; });
  paint();
  const hud = () => {
    if (phase === 'A') {
      const seq = pads.slice(0, 3 + round).map((p) => names[p.i]).join(' → ');
      UI.actHud('<b>沒有 KV Cache</b>　第 ' + (round + 1) + '／3 輪：依序踩過 ' + seq + '，才能生成 ' + names[3 + round] + '<div class="row"><span class="pill">已計算 token</span><span class="big">' + count + ' 次</span></div>');
    } else if (phase === 'B') {
      const seq = round === 0 ? 'x₁ → x₂ → x₃（prefill）' : '只踩新的 ' + names[2 + round];
      UI.actHud('<b>裝上 KV Cache</b>　第 ' + (round + 1) + '／3 輪：' + seq + '，就能生成 ' + names[3 + round] + '<div class="row"><span class="pill">已計算 token</span><span class="big">' + count + ' 次</span><span class="pill">剛才沒快取：12 次</span></div>');
    }
  };
  const finishRound = async () => {
    busy = true;
    const out = pads[3 + round];
    out.shown = true; AU.sfx('ok');
    E.fx.burst(o.x, y + 1, out.z, COL.orange, 26, 4, 0.9);
    UI.toast('生成了 ' + names[out.i] + '！', 'good', 1400);
    if (phase === 'A') {
      await sleep(700);
      pads.forEach((p) => { p.lit = false; });
      round++; expect = 0;
      if (round === 3) {
        paint(); UI.actHud(null);
        await UI.say([['cac', '呼……三個 token 就算了 <b>3 + 4 + 5 = 12</b> 次。每一輪都把整段前文從頭重算。'], ['kv', '其實 x₁、x₂、x₃ 的 K 和 V，第一輪就算過了。因果遮罩保證它們不會被後面的 token 改變。'], ['cac', '所以把算過的 K、V 存進水晶就好。這就是 <b>KV Cache</b>！回到起點再跑一次看看。']]);
        phase = 'B'; round = 0; expect = 0; count = 0;
        pads.forEach((p) => { p.shown = p.i < 3; p.lit = false; p.cached = false; });
        ctx.anchor(o.id, o.x, pads[0].z, y);
      } else UI.toast('沒有快取：剛剛算的全部丟掉了，回到 x₁ 重來', 'warn', 2400);
    } else {
      pads.forEach((p) => { if (p.lit) { p.cached = true; p.lit = false; } });
      round++; expect = firstIdx();
      if (round === 3) {
        phase = 'done'; paint(); UI.actHud(null);
        ctx.complete(o.id, 3);
        await UI.say([['kv', '這次只算了 <b>3 + 1 + 1 = 5</b> 次！舊 token 的 K、V 直接從快取讀，新 token 只算自己。'], ['cac', '一開始一次處理整段輸入叫 <b>prefill</b>，之後一個一個生成叫 <b>decode</b>。輸入越長，prefill 就越久，使用者等第一個字的時間（TTFT）也越久。'], ['kv', '記住這個痛點。CacheBlend 要對付的就是<b>又長又貴的 prefill</b>。']]);
      }
    }
    paint(); busy = false;
  };
  ctx.anchor(o.id, o.x, pads[0].z, y);
  lv.updates.push((dt, t) => {
    if (phase === 'done') return;
    const p = E.p.pos;
    const near = Math.abs(p.x - o.x) < 7 && p.z < o.z0 + 6 && p.z > o.z0 - 5 * o.dz - 5;
    if (!near) { UI.actHud(null); return; }
    if (busy) return;
    hud();
    const pad = pads[expect];

      expect++;
      const last = phase === 'A' ? need() : firstIdx() + need();
      paint();
      if (expect >= last) finishRound();
    }
  });
  lv.debug = lv.debug || {};
  lv.debug[o.id] = { pads, state: () => ({ phase, round, expect, count, busy }) };
};
